<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O2 Remote</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PeerJS for WebRTC Connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- QRCode.js for QR Code Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- HTML5-QRCode for In-App QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    #reader video {
      border-radius: 0.75rem;
      object-fit: cover;
      width: 100% !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-3 md:p-6 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="w-full max-w-xl mb-4 flex items-center justify-between border-b border-slate-800 pb-3">
    <div class="flex items-center gap-3">
      <div class="p-2.5 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">        
        <i data-lucide="monitor-play" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-wide bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">O2 Remote</h1>
        <p class="text-[11px] text-slate-400">Secure Screen Tunnels</p>
      </div>
    </div>

    <!-- Connection Status Badge -->
    <div id="status-badge" class="flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700">
      <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
      <span id="status-text">Initializing...</span>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="w-full max-w-xl flex flex-col gap-4 flex-1 justify-center">

    <!-- QR Handshake Card -->
    <div id="qr-card" class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col items-center text-center relative overflow-hidden transition-all duration-300">
      <div class="absolute -right-10 -top-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>

      <h2 class="text-base font-bold text-slate-100 mb-1">Pair Devices</h2>
      <p class="text-xs text-slate-400 mb-4 max-w-xs leading-relaxed">
        Scan this QR code from another device to establish a secure screen tunnel.
      </p>

      <!-- QR Code Box -->
      <div class="bg-white p-3 rounded-xl shadow-2xl border-4 border-slate-800 mb-4 relative min-h-[160px] min-w-[160px] flex items-center justify-center">
        <div id="qrcode"></div>
        <div id="qr-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 text-slate-400 rounded-lg">
          <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-indigo-400 mb-2"></i>
          <span class="text-xs">Generating ID...</span>
        </div>
      </div>

      <!-- Scan QR Code Button -->
      <button id="btn-open-scanner" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
        <i data-lucide="qr-code" class="w-4 h-4"></i>
        Scan QR Code with Camera
      </button>
    </div>

    <!-- Screen Share Viewport Container -->
    <div id="screen-container" class="hidden bg-slate-900 border border-indigo-500/30 rounded-2xl p-4 flex flex-col gap-3 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <span class="text-xs font-semibold text-indigo-400 flex items-center gap-2">
          <i data-lucide="monitor" class="w-4 h-4"></i> Live Screen Feed
        </span>
        <button id="btn-stop-screen" class="px-3 py-1 bg-red-600/20 text-red-400 border border-red-500/30 rounded-lg text-xs font-medium hidden hover:bg-red-600/30 transition">
          Stop Sharing
        </button>
      </div>
      <video id="remote-screen" autoplay playsinline class="w-full rounded-xl bg-slate-950 border border-slate-800 max-h-[380px] object-contain shadow-inner"></video>
    </div>

    <!-- Remote Controls Panel (Active when connected) -->
    <div id="control-panel" class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3 hidden">
      <div class="flex items-center justify-between">
        <h3 class="text-xs font-semibold text-slate-200 flex items-center gap-2">
          <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
          Tunnel Active
        </h3>
      </div>
      <button id="btn-share-screen" class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
        <i data-lucide="monitor-up" class="w-4 h-4"></i>
        Start Full Screen Sharing
      </button>
    </div>

  </main>

  <!-- MODAL: Camera Scanner -->
  <div id="scanner-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full shadow-2xl flex flex-col gap-4 relative">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
          <i data-lucide="camera" class="w-4 h-4 text-indigo-400"></i>
          Scan QR Code
        </h3>
        <button id="btn-close-scanner" class="text-slate-400 hover:text-white transition p-1 rounded-lg hover:bg-slate-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="overflow-hidden rounded-xl bg-slate-950 min-h-[220px] border border-slate-800 flex items-center justify-center relative">
        <div id="reader" class="w-full"></div>
      </div>

      <p class="text-[11px] text-slate-400 text-center">Point your camera at the QR code displayed on the other device.</p>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    let peer = null;
    let conn = null;
    let mediaCall = null;
    let localStream = null;
    let myPeerId = null;
    let html5QrcodeScanner = null;

    // UI Selectors
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const qrCard = document.getElementById('qr-card');
    const qrContainer = document.getElementById('qrcode');
    const qrLoader = document.getElementById('qr-loader');
    const controlPanel = document.getElementById('control-panel');
    const btnOpenScanner = document.getElementById('btn-open-scanner');
    const btnCloseScanner = document.getElementById('btn-close-scanner');
    const scannerModal = document.getElementById('scanner-modal');

    const btnShareScreen = document.getElementById('btn-share-screen');
    const btnStopScreen = document.getElementById('btn-stop-screen');
    const screenContainer = document.getElementById('screen-container');
    const remoteScreen = document.getElementById('remote-screen');

    // Initialize Lucide Icons
    lucide.createIcons();

    // Check URL parameters for direct connect via QR scan link
    const urlParams = new URLSearchParams(window.location.search);
    const targetFromUrl = urlParams.get('connect');

    function initPeer() {
      peer = new Peer({ debug: 1 });

      peer.on('open', (id) => {
        myPeerId = id;
        qrLoader.classList.add('hidden');

        const currentUrl = window.location.origin + window.location.pathname;
        const connectUrl = `${currentUrl}?connect=${id}`;
        
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
          text: connectUrl,
          width: 150,
          height: 150,
          colorDark: "#0f172a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        updateStatus('waiting', 'Ready');

        if (targetFromUrl) {
          connectToPeer(targetFromUrl);
        }
      });

      peer.on('connection', (incomingConn) => {
        setupConnection(incomingConn);
      });

      // Handle incoming screen share stream
      peer.on('call', (call) => {
        mediaCall = call;
        call.answer(); 
        call.on('stream', (remoteStreamVideo) => {
          screenContainer.classList.remove('hidden');
          remoteScreen.srcObject = remoteStreamVideo;
        });
        call.on('close', stopRemoteScreenView);
      });

      peer.on('error', (err) => {
        console.error('PeerJS Error:', err);
        updateStatus('error', 'Connection Error');
      });
    }

    function connectToPeer(targetId) {
      if (!targetId || targetId === myPeerId) return;
      updateStatus('connecting', 'Connecting...');
      const outgoingConn = peer.connect(targetId, { reliable: true });
      setupConnection(outgoingConn);
    }

    function setupConnection(connection) {
      conn = connection;

      conn.on('open', () => {
        updateStatus('connected', 'Connected');
      });

      conn.on('close', () => {
        updateStatus('waiting', 'Disconnected');
        stopScreenShare();
      });
    }

    function updateStatus(state, message) {
      statusText.textContent = message;
      if (state === 'connected') {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-emerald-400';

        // Hide QR Card and show Control Panel when connected
        qrCard.classList.add('opacity-0', 'scale-95', 'pointer-events-none', 'hidden');
        controlPanel.classList.remove('hidden');
      } else if (state === 'connecting') {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/30';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-indigo-400 animate-ping';
      } else {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';

        // Show QR Card and hide Control Panel if disconnected
        qrCard.classList.remove('opacity-0', 'scale-95', 'pointer-events-none', 'hidden');
        controlPanel.classList.add('hidden');
      }
    }

    // Screen Sharing Logic (Prefers Full Screen Monitor)
    async function startScreenShare() {
      if (!conn || !conn.open) {
        alert("Please connect to a peer first.");
        return;
      }

      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            displaySurface: "monitor" 
          },
          audio: false
        });

        screenContainer.classList.remove('hidden');
        remoteScreen.srcObject = localStream;
        btnStopScreen.classList.remove('hidden');

        mediaCall = peer.call(conn.peer, localStream);

        localStream.getVideoTracks()[0].onended = () => {
          stopScreenShare();
        };

      } catch (err) {
        console.error("Screen Share cancelled/failed:", err);
      }
    }

    function stopScreenShare() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (mediaCall) {
        mediaCall.close();
        mediaCall = null;
      }
      stopRemoteScreenView();
    }

    function stopRemoteScreenView() {
      remoteScreen.srcObject = null;
      screenContainer.classList.add('hidden');
      btnStopScreen.classList.add('hidden');
    }

    // Scanner Modal Handlers
    function openScanner() {
      scannerModal.classList.remove('hidden');
      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      }
      const config = { fps: 10, qrbox: { width: 180, height: 180 } };
      html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, () => {}).catch(err => {
        alert("Camera access failed or permission denied.");
        closeScanner();
      });
    }

    function closeScanner() {
      if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        html5QrcodeScanner.stop().then(() => scannerModal.classList.add('hidden')).catch(() => scannerModal.classList.add('hidden'));
      } else {
        scannerModal.classList.add('hidden');
      }
    }

    function onScanSuccess(decodedText) {
      let scannedPeerId = decodedText;
      try {
        if (decodedText.includes('connect=')) {
          const parsedUrl = new URL(decodedText);
          scannedPeerId = parsedUrl.searchParams.get('connect') || decodedText;
        }
      } catch (e) {}

      closeScanner();
      connectToPeer(scannedPeerId);
    }

    // Event Listeners
    btnShareScreen.addEventListener('click', startScreenShare);
    btnStopScreen.addEventListener('click', stopScreenShare);

    btnOpenScanner.addEventListener('click', openScanner);
    btnCloseScanner.addEventListener('click', closeScanner);

    window.addEventListener('load', initPeer);
  </script>

  <!-- Security Scripts -->
  <script>
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    document.onkeydown = function (e) {
        if (e.keyCode == 123) return false; // F12
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
    };
  </script>
</body>
</html>
