<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O2 Chat & Tunnel</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PeerJS for WebRTC Connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- QRCode.js for QR Code Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- HTML5-QRCode for In-App QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    #reader video {
      border-radius: 0.75rem;
      object-fit: cover;
      width: 100% !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-start p-4 md:p-6 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="w-full max-w-xl mb-4 flex items-center justify-between border-b border-slate-800 pb-3">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">        
        <i data-lucide="bot" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-wide bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">O2 CBUS</h1>
        <p class="text-[11px] text-slate-400">Secure Private Tunnels</p>
      </div>
    </div>

    <!-- Connection Status Badge -->
    <div id="status-badge" class="flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700">
      <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
      <span id="status-text">Initializing...</span>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="w-full max-w-xl flex flex-col gap-4">

    <!-- QR Handshake Card -->
    <div id="qr-card" class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col items-center text-center relative overflow-hidden transition-all duration-300">
      <div class="absolute -right-10 -top-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>

      <h2 class="text-base font-bold text-slate-100 mb-1">Pair Devices</h2>
      <p class="text-xs text-slate-400 mb-3 max-w-xs leading-relaxed">
        Scan this QR code from another device to connect instantly.
      </p>

      <!-- QR Code Box -->
      <div class="bg-white p-3 rounded-xl shadow-2xl border-4 border-slate-800 mb-3 relative min-h-[150px] min-w-[150px] flex items-center justify-center">
        <div id="qrcode"></div>
        <div id="qr-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 text-slate-400 rounded-lg">
          <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-indigo-400 mb-2"></i>
          <span class="text-xs">Generating ID...</span>
        </div>
      </div>

      <!-- Scan QR Code Button -->
      <button id="btn-open-scanner" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
        <i data-lucide="qr-code" class="w-4 h-4"></i>
        Scan QR Code with Camera
      </button>
    </div>

    <!-- Chat Interface Section -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col h-[400px]">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
        <h3 class="text-xs font-semibold text-slate-200 flex items-center gap-2">
          <i data-lucide="message-square" class="w-4 h-4 text-cyan-400"></i>
          Secure Tunnel Chat
        </h3>
        <button id="btn-clear-history" class="text-xs text-slate-500 hover:text-slate-300 transition flex items-center gap-1">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          Clear
        </button>
      </div>

      <!-- Message History List -->
      <div id="chat-list" class="flex-1 space-y-3 overflow-y-auto pr-1">
        <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-600 text-center">
          <i data-lucide="shield" class="w-8 h-8 mb-2 opacity-40"></i>
          <p class="text-xs">Paired and ready. Send a message to start.</p>
        </div>
      </div>

      <!-- Main Quick Reactions Bar -->
      <div class="flex items-center justify-around border-t border-slate-800/80 pt-3 mt-3 bg-slate-950/40 p-2 rounded-xl">
        <button onclick="sendQuickReaction('👍')" class="text-lg hover:scale-125 transition-transform p-1">👍</button>
        <button onclick="sendQuickReaction('😂')" class="text-lg hover:scale-125 transition-transform p-1">😂</button>
        <button onclick="sendQuickReaction('❤️')" class="text-lg hover:scale-125 transition-transform p-1">❤️</button>
        <button onclick="sendQuickReaction('🔥')" class="text-lg hover:scale-125 transition-transform p-1">🔥</button>
        <button onclick="sendQuickReaction('🎉')" class="text-lg hover:scale-125 transition-transform p-1">🎉</button>
      </div>

      <!-- Input Area -->
      <div class="flex flex-col gap-2 border-t border-slate-800 pt-3 mt-2">
        <div class="flex items-center gap-2">
          <button id="btn-paste-clipboard" title="Paste from Clipboard" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition flex items-center justify-center border border-slate-700">
            <i data-lucide="clipboard" class="w-4 h-4"></i>
          </button>
          <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
          <button id="btn-send-chat" class="py-3 px-5 bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white rounded-xl text-xs font-semibold transition flex items-center justify-center shadow-lg shadow-indigo-600/20">
            <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- MODAL: Camera Scanner -->
  <div id="scanner-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full shadow-2xl flex flex-col gap-4 relative">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
          <i data-lucide="camera" class="w-4 h-4 text-indigo-400"></i>
          Scan QR Code
        </h3>
        <button id="btn-close-scanner" class="text-slate-400 hover:text-white transition p-1 rounded-lg hover:bg-slate-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="overflow-hidden rounded-xl bg-slate-950 min-h-[220px] border border-slate-800 flex items-center justify-center relative">
        <div id="reader" class="w-full"></div>
      </div>

      <p class="text-[11px] text-slate-400 text-center">Point your camera at the QR code displayed on the other device.</p>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    let peer = null;
    let conn = null;
    let myPeerId = null;
    let html5QrcodeScanner = null;

    // UI Selectors
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const qrCard = document.getElementById('qr-card');
    const qrContainer = document.getElementById('qrcode');
    const qrLoader = document.getElementById('qr-loader');
    const chatInput = document.getElementById('chat-input');
    const btnSendChat = document.getElementById('btn-send-chat');
    const btnPasteClipboard = document.getElementById('btn-paste-clipboard');
    const chatList = document.getElementById('chat-list');
    const emptyState = document.getElementById('empty-state');
    const btnClearHistory = document.getElementById('btn-clear-history');
    const btnOpenScanner = document.getElementById('btn-open-scanner');
    const btnCloseScanner = document.getElementById('btn-close-scanner');
    const scannerModal = document.getElementById('scanner-modal');

    // Initialize Lucide Icons
    lucide.createIcons();

    // Check URL parameters for direct connect via QR scan link
    const urlParams = new URLSearchParams(window.location.search);
    const targetFromUrl = urlParams.get('connect');

    function initPeer() {
      peer = new Peer({ debug: 1 });

      peer.on('open', (id) => {
        myPeerId = id;
        qrLoader.classList.add('hidden');

        const currentUrl = window.location.origin + window.location.pathname;
        const connectUrl = `${currentUrl}?connect=${id}`;
        
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
          text: connectUrl,
          width: 140,
          height: 140,
          colorDark: "#0f172a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        updateStatus('waiting', 'Ready');

        if (targetFromUrl) {
          connectToPeer(targetFromUrl);
        }
      });

      peer.on('connection', (incomingConn) => {
        setupConnection(incomingConn);
      });

      peer.on('error', (err) => {
        console.error('PeerJS Error:', err);
        updateStatus('error', 'Connection Error');
      });
    }

    function connectToPeer(targetId) {
      if (!targetId || targetId === myPeerId) return;
      updateStatus('connecting', 'Connecting...');
      const outgoingConn = peer.connect(targetId, { reliable: true });
      setupConnection(outgoingConn);
    }

    function setupConnection(connection) {
      conn = connection;

      conn.on('open', () => {
        updateStatus('connected', 'Connected');
      });

      conn.on('data', (data) => {
        if (typeof data === 'object' && data.type === 'chat') {
          renderChatMessage(data.content, 'received');
        }
      });

      conn.on('close', () => {
        updateStatus('waiting', 'Disconnected');
      });
    }

    function updateStatus(state, message) {
      statusText.textContent = message;
      if (state === 'connected') {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-emerald-400';

        // Automatically hide QR Card when connected
        qrCard.classList.add('opacity-0', 'scale-95', 'pointer-events-none', 'hidden');
      } else if (state === 'connecting') {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/30';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-indigo-400 animate-ping';
      } else {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';

        // Show QR Card if disconnected
        qrCard.classList.remove('opacity-0', 'scale-95', 'pointer-events-none', 'hidden');
      }
    }

    function sendChatMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      if (!conn || !conn.open) {
        alert('Please connect to a peer first by scanning their QR code.');
        return;
      }

      conn.send({ type: 'chat', content: text });
      renderChatMessage(text, 'sent');
      chatInput.value = '';
    }

    window.sendQuickReaction = function(emoji) {
      if (!conn || !conn.open) {
        alert('Please connect to a peer first by scanning their QR code.');
        return;
      }
      conn.send({ type: 'chat', content: emoji });
      renderChatMessage(emoji, 'sent');
    };

    function renderChatMessage(messageText, direction) {
      if (emptyState) emptyState.style.display = 'none';
      const isSent = direction === 'sent';

      const messageWrapper = document.createElement('div');
      messageWrapper.className = `flex ${isSent ? 'justify-end' : 'justify-start'}`;

      const messageBubble = document.createElement('div');
      messageBubble.className = `max-w-[80%] p-3 rounded-2xl text-xs flex flex-col gap-1 shadow-sm ${
        isSent 
          ? 'bg-indigo-600 text-white rounded-tr-none' 
          : 'bg-slate-800 text-slate-100 rounded-tl-none border border-slate-700'
      }`;

      // Check if the message is just a single emoji
      const isSingleEmoji = /^[\p{Emoji_Presentation}\u{FE0F}\u{200D}]+$/u.test(messageText);

      messageBubble.innerHTML = `
        <p class="${isSingleEmoji ? 'text-2xl py-1' : 'leading-relaxed break-words'}">${escapeHtml(messageText)}</p>
        <span class="text-[9px] ${isSent ? 'text-indigo-200' : 'text-slate-400'} self-end mt-0.5">
          ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
        </span>
      `;

      messageWrapper.appendChild(messageBubble);
      chatList.appendChild(messageWrapper);
      chatList.scrollTop = chatList.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Paste Action
    btnPasteClipboard.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          chatInput.value = text;
        }
      } catch (err) {
        alert('Paste permission denied. Please paste manually using Ctrl+V or long-press.');
      }
    });

    // Scanner Modal Handlers
    function openScanner() {
      scannerModal.classList.remove('hidden');
      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      }
      const config = { fps: 10, qrbox: { width: 180, height: 180 } };
      html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, () => {}).catch(err => {
        alert("Camera access failed or permission denied.");
        closeScanner();
      });
    }

    function closeScanner() {
      if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        html5QrcodeScanner.stop().then(() => scannerModal.classList.add('hidden')).catch(() => scannerModal.classList.add('hidden'));
      } else {
        scannerModal.classList.add('hidden');
      }
    }

    function onScanSuccess(decodedText) {
      let scannedPeerId = decodedText;
      try {
        if (decodedText.includes('connect=')) {
          const parsedUrl = new URL(decodedText);
          scannedPeerId = parsedUrl.searchParams.get('connect') || decodedText;
        }
      } catch (e) {}

      closeScanner();
      connectToPeer(scannedPeerId);
    }

    // Event Listeners
    btnSendChat.addEventListener('click', sendChatMessage);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChatMessage();
    });

    btnOpenScanner.addEventListener('click', openScanner);
    btnCloseScanner.addEventListener('click', closeScanner);

    btnClearHistory.addEventListener('click', () => {
      chatList.innerHTML = '';
      chatList.appendChild(emptyState);
      emptyState.style.display = 'flex';
    });

    window.addEventListener('load', initPeer);
  </script>

  <!-- Security Scripts (Allowing paste inside input fields) -->
  <script>
    document.addEventListener('contextmenu', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        return true;
      }
      e.preventDefault();
    });

    document.onkeydown = function (e) {
        if (e.keyCode == 123) return false; // F12
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
    };
  </script>
</body>
</html>
