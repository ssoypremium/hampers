<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>voip phone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .ring-pulse {
      animation: ring-pulse 1.2s ease-in-out infinite alternate;
    }
    @keyframes ring-pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      100% { transform: scale(1.05); box-shadow: 0 0 0 25px rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-4 text-white min-h-screen">

  <div class="w-full max-w-md glass rounded-3xl p-6 shadow-2xl flex flex-col justify-between min-h-[620px] relative overflow-hidden">
    
    <!-- Top Header -->
    <div class="flex items-center justify-between border-b border-slate-700/50 pb-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-emerald-600/30 border border-emerald-400/30 flex items-center justify-center text-emerald-400 font-bold text-lg">
          O2
        </div>
        <div>
          <h1 class="font-semibold text-lg text-slate-100">VoIP</h1>
          <p class="text-xs text-slate-400">Receiver Terminal</p>
        </div>
      </div>
      <div id="statusBadge" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700">
        Listening
      </div>
    </div>

    <!-- Main Dynamic Receiver Display -->
    <div class="my-auto flex flex-col items-center justify-center text-center space-y-6 py-6">
      
      <!-- Avatar Status Icon -->
      <div class="relative">
        <div id="avatarRing" class="w-28 h-28 rounded-full bg-slate-800/80 border-2 border-slate-600 flex items-center justify-center transition-all duration-300">
          <i id="avatarIcon" class="fa-solid fa-phone-slash text-4xl text-slate-500"></i>
        </div>
      </div>

      <!-- Text Details -->
      <div>
        <h2 id="callStateTitle" class="text-xl font-medium text-slate-200">Waiting for Call...</h2>
        <p id="callTimer" class="text-3xl font-mono font-bold text-emerald-400 mt-1 hidden">00:00</p>
        <p id="statusSubtext" class="text-xs text-slate-400 mt-2 max-w-[240px]">End to End VoIP conversation.</p>
      </div>

      <!-- Realtime Audio Visualizer Meters -->
      <div id="audioVisualizers" class="w-full space-y-3 pt-2 opacity-50 transition-opacity">
        <div>
          <div class="flex justify-between text-[10px] text-slate-400 mb-1 font-medium">
            <span><i class="fa-solid fa-microphone mr-1"></i>Local</span>
            <span id="localVolText">0%</span>
          </div>
          <div class="w-full bg-slate-800/80 rounded-full h-2 overflow-hidden border border-slate-700/50">
            <div id="localMeter" class="bg-emerald-500 h-full w-0% transition-all duration-75 rounded-full"></div>
          </div>
        </div>

        <div>
          <div class="flex justify-between text-[10px] text-slate-400 mb-1 font-medium">
            <span><i class="fa-solid fa-volume-high mr-1"></i>voIP</span>
            <span id="remoteVolText">0%</span>
          </div>
          <div class="w-full bg-slate-800/80 rounded-full h-2 overflow-hidden border border-slate-700/50">
            <div id="remoteMeter" class="bg-blue-500 h-full w-0% transition-all duration-75 rounded-full"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Controls Bottom Bar -->
    <div class="space-y-3 pt-4 border-t border-slate-700/50">
      
      <!-- Idle State (NO Outgoing call allowed) -->
      <div id="idleStateText" class="text-center py-2 text-xs text-slate-500 font-medium">
        <i class="fa-solid fa-circle-info mr-1"></i>Personal VoIP Communication System
      </div>

      <!-- Incoming Ringing Call Controls -->
      <div id="incomingControls" class="hidden flex gap-3">
        <button onclick="rejectCall()" class="w-1/2 py-3.5 px-4 bg-red-600 hover:bg-red-500 active:scale-95 text-white font-medium rounded-xl shadow-lg shadow-red-600/30 flex items-center justify-center space-x-2 transition">
          <i class="fa-solid fa-phone-slash"></i>
          <span>Reject</span>
        </button>
        <button onclick="answerCall()" class="w-1/2 py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-medium rounded-xl shadow-lg shadow-emerald-600/30 flex items-center justify-center space-x-2 transition">
          <i class="fa-solid fa-phone"></i>
          <span>Answer</span>
        </button>
      </div>

      <!-- Connected Active Call Controls -->
      <div id="activeControls" class="hidden flex items-center justify-center space-x-4">
        <!-- Mute Button -->
        <button id="muteBtn" onclick="toggleMute()" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 flex items-center justify-center text-lg transition active:scale-90">
          <i id="muteIcon" class="fa-solid fa-microphone"></i>
        </button>

        <!-- Cut Call Button -->
        <button onclick="cutCall()" class="py-3.5 px-6 bg-red-600 hover:bg-red-500 active:scale-95 text-white font-medium rounded-xl shadow-lg shadow-red-600/30 flex items-center justify-center space-x-2 transition">
          <i class="fa-solid fa-phone-slash"></i>
          <span>Cut Call</span>
        </button>
      </div>

    </div>

  </div>

  <!-- Hidden Remote Audio Element -->
  <audio id="remoteAudio" autoplay></audio>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove, push, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://voip-e867a-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Call state variables
    let localStream = null;
    let peerConnection = null;
    let isMuted = false;
    let timerInterval = null;
    let secondsElapsed = 0;
    let currentOfferData = null;
    let callSessionRef = ref(db, 'calls/active_call');
    let receiverCandidatesRef = ref(db, 'calls/active_call/receiverCandidates');

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19020' },
        { urls: 'stun:stun1.l.google.com:19020' }
      ]
    };

    // UI elements
    const statusBadge = document.getElementById('statusBadge');
    const callStateTitle = document.getElementById('callStateTitle');
    const statusSubtext = document.getElementById('statusSubtext');
    const callTimer = document.getElementById('callTimer');
    const avatarRing = document.getElementById('avatarRing');
    const avatarIcon = document.getElementById('avatarIcon');
    const idleStateText = document.getElementById('idleStateText');
    const incomingControls = document.getElementById('incomingControls');
    const activeControls = document.getElementById('activeControls');
    const audioVisualizers = document.getElementById('audioVisualizers');
    const muteBtn = document.getElementById('muteBtn');
    const muteIcon = document.getElementById('muteIcon');

    // Attach handlers for inline HTML clicks
    window.answerCall = answerCall;
    window.rejectCall = rejectCall;
    window.cutCall = cutCall;
    window.toggleMute = toggleMute;

    // Listen to incoming call requests from Firebase
    onValue(callSessionRef, (snapshot) => {
      const data = snapshot.val();

      if (!data) {
        if (peerConnection || currentOfferData) {
          resetCallUI("Call Ended by Phone 1");
        }
        return;
      }

      // Handle call state updates
      if (data.status === 'ringing' && !peerConnection) {
        currentOfferData = data.offer;
        updateStatusUI('ringing', 'Incoming Call', 'ssoy is calling you...');
      } else if (data.status === 'ended') {
        resetCallUI("Call Ended");
      }
    });

    // Listen for caller ICE Candidates
    const callerCandidatesRef = ref(db, 'calls/active_call/callerCandidates');
    onValue(callerCandidatesRef, (snapshot) => {
      snapshot.forEach((child) => {
        const candidate = child.val();
        if (peerConnection && candidate) {
          peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => console.error(e));
        }
      });
    });

    async function answerCall() {
      if (!currentOfferData) return;

      try {
        // Microphone Access
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        setupAudioVisualizer(localStream, 'localMeter', 'localVolText');

        peerConnection = new RTCPeerConnection(rtcConfig);

        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        // Collect local ICE candidates
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            push(receiverCandidatesRef, event.candidate.toJSON());
          }
        };

        // Stream remote voice
        peerConnection.ontrack = (event) => {
          const remoteAudio = document.getElementById('remoteAudio');
          remoteAudio.srcObject = event.streams[0];
          setupAudioVisualizer(event.streams[0], 'remoteMeter', 'remoteVolText');
        };

        // Set Remote Offer
        await peerConnection.setRemoteDescription(new RTCSessionDescription(currentOfferData));

        // Create Answer
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        // Update database status
        await update(callSessionRef, {
          answer: {
            type: answer.type,
            sdp: answer.sdp
          },
          status: 'connected'
        });

        updateStatusUI('connected', 'In Call with Phone 1', 'Talking now...');
        startTimer();

      } catch (err) {
        console.error("Error answering call:", err);
        alert("Microphone permission needed to answer the call.");
        rejectCall();
      }
    }

    async function rejectCall() {
      await update(callSessionRef, { status: 'rejected' }).catch(() => {});
      setTimeout(() => remove(callSessionRef), 500);
      resetCallUI("Call Rejected");
    }

    async function cutCall() {
      await update(callSessionRef, { status: 'ended' }).catch(() => {});
      setTimeout(() => remove(callSessionRef), 500);
      resetCallUI("Call Cut");
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;

      if (isMuted) {
        muteBtn.classList.replace('bg-slate-800', 'bg-red-600/30');
        muteBtn.classList.add('text-red-400', 'border-red-500/50');
        muteIcon.className = "fa-solid fa-microphone-slash";
      } else {
        muteBtn.classList.replace('bg-red-600/30', 'bg-slate-800');
        muteBtn.classList.remove('text-red-400', 'border-red-500/50');
        muteIcon.className = "fa-solid fa-microphone";
      }
    }

    function resetCallUI(message) {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      currentOfferData = null;
      stopTimer();

      updateStatusUI('idle', message || 'Waiting for Call...', 'This phone can only receive incoming calls from Phone 11.');

      document.getElementById('localMeter').style.width = '0%';
      document.getElementById('remoteMeter').style.width = '0%';
      document.getElementById('localVolText').textContent = '0%';
      document.getElementById('remoteVolText').textContent = '0%';
    }

    function updateStatusUI(status, title, subtext) {
      callStateTitle.textContent = title;
      statusSubtext.textContent = subtext;

      avatarRing.className = "w-28 h-28 rounded-full flex items-center justify-center transition-all duration-300 ";

      if (status === 'ringing') {
        avatarRing.className += "bg-emerald-600/20 border-2 border-emerald-500 ring-pulse";
        avatarIcon.className = "fa-solid fa-phone-volume text-4xl text-emerald-400 animate-bounce";
        statusBadge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        statusBadge.textContent = "Incoming Call!";
        idleStateText.classList.add('hidden');
        incomingControls.classList.remove('hidden');
        activeControls.classList.add('hidden');
        audioVisualizers.classList.add('opacity-50');
      } else if (status === 'connected') {
        avatarRing.className += "bg-emerald-600/20 border-2 border-emerald-500";
        avatarIcon.className = "fa-solid fa-headset text-4xl text-emerald-400";
        statusBadge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        statusBadge.textContent = "In Call";
        callTimer.classList.remove('hidden');
        idleStateText.classList.add('hidden');
        incomingControls.classList.add('hidden');
        activeControls.classList.remove('hidden');
        audioVisualizers.classList.remove('opacity-50');
      } else { // idle / ended
        avatarRing.className += "bg-slate-800/80 border-2 border-slate-600";
        avatarIcon.className = "fa-solid fa-phone-slash text-4xl text-slate-500";
        statusBadge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700";
        statusBadge.textContent = "Listening";
        callTimer.classList.add('hidden');
        idleStateText.classList.remove('hidden');
        incomingControls.classList.add('hidden');
        activeControls.classList.add('hidden');
        audioVisualizers.classList.add('opacity-50');
      }
    }

    function startTimer() {
      stopTimer();
      secondsElapsed = 0;
      callTimer.textContent = "00:00";
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        callTimer.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function setupAudioVisualizer(stream, meterId, textId) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const analyser = ctx.createAnalyser();
        const source = ctx.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 64;

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const meterEl = document.getElementById(meterId);
        const textEl = document.getElementById(textId);

        function updateMeter() {
          if (!stream.active) return;
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          let average = sum / dataArray.length;
          let percent = Math.min(100, Math.round((average / 128) * 100));

          meterEl.style.width = percent + '%';
          textEl.textContent = percent + '%';

          requestAnimationFrame(updateMeter);
        }

        updateMeter();
      } catch (e) {
        console.error("Visualizer Error:", e);
      }
    }
  </script>
</body>
</html>
