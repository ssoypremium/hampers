<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #111;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        button {
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #e50914;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }
        button:disabled {
            background-color: #555;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="preview" autoplay playsinline muted></video>
        <div class="controls">
            <button id="startBtn" onclick="startBroadcasting()">Start Broadcast</button>
        </div>
    </div>

    <script>
        async function startBroadcasting() {
            const btn = document.getElementById('startBtn');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" },
                    audio: true
                });
                document.getElementById('preview').srcObject = stream;
                btn.innerText = "Broadcasting...";
                btn.disabled = true;
                
                // WebRTC Signaling Code (Node.js / Socket.io) यहाँ कनेक्ट होगा
            } catch (err) {
                alert("कैमरा या माइक की अनुमति नहीं मिली!");
                console.error(err);
            }
        }
    </script>
</body>
</html>
