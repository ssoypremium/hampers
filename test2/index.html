<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encrypted QR A4 Label Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, sans-serif; }
    
    /* A4 Print & Border Styles */
    @media print {
      body * { visibility: hidden; }
      #printable-sheet, #printable-sheet * { visibility: visible; }
      #printable-sheet { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; }
      .no-print { display: none !important; }
      @page { size: A4 portrait; margin: 8mm; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 antialiased">

  <!-- Control Form (Screen Only) -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-xl w-full flex flex-col gap-4 shadow-2xl mb-8 no-print">
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <h2 class="text-base font-bold text-white flex items-center gap-2">
        <i data-lucide="lock" class="w-5 h-5 text-indigo-400"></i> Encrypted A4 QR Sheet Studio
      </h2>
      <span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded-full border border-indigo-500/30">Secure Encrypted Data</span>
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="text-xs text-slate-400">Item Name:</label>
        <input type="text" id="item-name" value="Wireless Mouse" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="text-xs text-slate-400">Declaration / Desc:</label>
        <input type="text" id="item-desc" value="Ergonomic 2.4G" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="text-xs text-slate-400">Hidden Price (₹):</label>
        <input type="number" id="item-price" value="499.00" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="text-xs text-slate-400">Default Qty per Scan:</label>
        <input type="number" id="item-qty" value="1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>
    </div>
    
    <div class="flex gap-2">
      <button onclick="generateA4Sheet()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-lg transition">
        Generate Encrypted Grid
      </button>

      <button onclick="window.print()" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 shadow-lg transition">
        <i data-lucide="printer" class="w-4 h-4"></i> Print / Save A4 (PDF)
      </button>
    </div>
  </div>

  <!-- Printable A4 Sheet Grid Container -->
  <div id="printable-sheet" class="bg-white p-4 rounded-lg shadow-2xl w-[210mm] min-h-[297mm] flex flex-col text-black">
    <div class="text-center mb-3 border-b border-gray-300 pb-2">
      <h3 id="sheet-title" class="text-sm font-bold tracking-widest text-gray-800">ENCRYPTED PRODUCT LABELS</h3>
      <p class="text-[10px] text-gray-500">Cut-Border Grid (45mm x 30mm) - Scannable via ScanBilling App Only</p>
    </div>

    <!-- Grid Layout with Cut Borders -->
    <div class="grid grid-cols-4 gap-2 flex-1 justify-items-center">
      <!-- Dynamic Labels Injected Here -->
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Simple XOR Cipher for Encrypting QR Payload
    const SECRET_KEY = "CAM_SYNC_SECRET_BILLING_KEY";

    function encryptData(text) {
      let result = '';
      for (let i = 0; i < text.length; i++) {
        result += String.fromCharCode(text.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
      }
      return "ENC:" + btoa(result);
    }

    function generateA4Sheet() {
      const name = document.getElementById('item-name').value;
      const desc = document.getElementById('item-desc').value;
      const price = parseFloat(document.getElementById('item-price').value) || 0;
      const qty = parseInt(document.getElementById('item-qty').value) || 1;

      const rawJson = JSON.stringify({ name, desc, price, qty });
      const encryptedPayload = encryptData(rawJson);

      const gridContainer = document.querySelector('#printable-sheet .grid');
      gridContainer.innerHTML = ''; 

      document.getElementById('sheet-title').textContent = (name.toUpperCase() || "PRODUCT") + " - ENCRYPTED LABELS";

      // Create 24 Labels for Full A4 Page Fill with Cut Border
      for (let i = 0; i < 24; i++) {
        const labelBox = document.createElement('div');
        // Border applied for easy cutting
        labelBox.className = "w-[45mm] h-[32mm] border-2 border-dashed border-gray-400 p-1.5 flex flex-col items-center justify-between bg-white rounded-sm box-border relative";
        
        labelBox.innerHTML = `
          <div class="text-[9px] font-bold text-gray-800 truncate w-full text-center leading-tight">${name}</div>
          <div class="qr-placeholder w-[22mm] h-[22mm] flex items-center justify-center my-0.5"></div>
          <div class="text-[7.5px] font-mono text-gray-500 truncate w-full text-center">${desc}</div>
        `;

        gridContainer.appendChild(labelBox);

        const qrPlace = labelBox.querySelector('.qr-placeholder');
        new QRCode(qrPlace, {
          text: encryptedPayload,
          width: 80,
          height: 80,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
      lucide.createIcons();
    }

    window.onload = generateA4Sheet;
  </script>
</body>
</html>
