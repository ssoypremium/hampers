<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O2 QR Code Generator - 15 Print Layout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, sans-serif; }
    
    /* A4 Print Optimization */
    @media print {
      body { background-color: #ffffff !important; color: #000000 !important; }
      .no-print { display: none !important; }
      #a4-print-area {
        width: 100% !important;
        padding: 0 !important;
        box-shadow: none !important;
      }
      .qr-card {
        border: 1px dashed #666 !important;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex flex-col items-center">

  <!-- Header Section -->
  <header class="w-full max-w-5xl mb-6 flex items-center justify-between border-b border-slate-800 pb-4 no-print">
    <div>
      <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-teal-300 bg-clip-text text-transparent">
        O2 QR Code Generator
      </h1>
      <p class="text-xs text-slate-400">A4 Printable Encrypted QR Label Maker</p>
    </div>
    <button onclick="window.print()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold flex items-center gap-2 shadow-lg transition">
      <i data-lucide="printer" class="w-4 h-4"></i> Print A4 Sheet
    </button>
  </header>

  <main class="w-full max-w-5xl flex flex-col gap-6">

    <!-- Input Form -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl no-print">
      <h2 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i> Add Item to Generate QR Codes
      </h2>
      
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <div class="sm:col-span-2">
          <label class="text-[11px] text-slate-400">Item Description / Name:</label>
          <input type="text" id="item-name" placeholder="e.g. Hair Oil / Item Name" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 mt-1">
        </div>
        <div>
          <label class="text-[11px] text-slate-400">Quantity (QR Count):</label>
          <input type="number" id="item-qty" value="1" min="1" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 mt-1 font-mono">
        </div>
        <div>
          <label class="text-[11px] text-slate-400">Rate / Price (₹):</label>
          <input type="number" id="item-price" step="0.01" value="0.00" min="0" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 mt-1 font-mono">
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-4">
        <button onclick="clearAllQRs()" class="px-4 py-2 bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 text-xs font-semibold rounded-xl flex items-center gap-1.5 transition">
          <i data-lucide="trash-2" class="w-4 h-4"></i> Clear All
        </button>
        <button onclick="generateQRCodes()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl flex items-center gap-1.5 shadow-lg transition">
          <i data-lucide="qr-code" class="w-4 h-4"></i> Add Item & Generate QR
        </button>
      </div>
    </div>

    <!-- A4 Printable Grid Area -->
    <div id="a4-print-area" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl min-h-[600px]">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4 no-print">
        <span class="text-xs font-semibold text-slate-300">Generated QR Labels Preview (A4 Sheet Layout)</span>
        <span id="total-count-badge" class="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">Total QRs: 0</span>
      </div>

      <div id="qr-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        <div id="empty-msg" class="col-span-full py-16 text-center text-slate-500 text-xs">
          No QR codes generated yet. Add an item above!
        </div>
      </div>
    </div>

  </main>

  <script>
    const SECRET_KEY = "CAM_SYNC_SECRET_BILLING_KEY";
    let qrItemsList = [];

    lucide.createIcons();

    function encryptData(obj) {
      const jsonString = JSON.stringify(obj);
      let encrypted = '';
      for (let i = 0; i < jsonString.length; i++) {
        encrypted += String.fromCharCode(jsonString.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
      }
      return "ENC:" + btoa(encrypted);
    }

    function generateQRCodes() {
      const name = document.getElementById('item-name').value.trim();
      const qty = parseInt(document.getElementById('item-qty').value) || 1;
      const price = parseFloat(document.getElementById('item-price').value) || 0;

      if (!name) {
        alert("Please enter Item Description/Name!");
        return;
      }

      // Encrypted Payload Format expected by Scanner
      const payloadObj = {
        name: name,
        qty: 1, // Individual label represents 1 qty
        price: price
      };

      const encryptedPayload = encryptData(payloadObj);

      // Add 'qty' number of QR cards
      for (let i = 0; i < qty; i++) {
        qrItemsList.push({
          id: Date.now() + Math.random(),
          name: name,
          price: price,
          payload: encryptedPayload
        });
      }

      renderQRGrid();

      // Reset Form Inputs
      document.getElementById('item-name').value = '';
      document.getElementById('item-qty').value = '1';
      document.getElementById('item-price').value = '0.00';
    }

    function renderQRGrid() {
      const grid = document.getElementById('qr-grid');
      grid.innerHTML = '';

      if (qrItemsList.length === 0) {
        grid.innerHTML = `<div id="empty-msg" class="col-span-full py-16 text-center text-slate-500 text-xs">No QR codes generated yet. Add an item above!</div>`;
        document.getElementById('total-count-badge').textContent = `Total QRs: 0`;
        return;
      }

      document.getElementById('total-count-badge').textContent = `Total QRs: ${qrItemsList.length}`;

      qrItemsList.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "qr-card bg-white text-black p-3 rounded-xl border border-gray-300 flex flex-col items-center justify-between text-center shadow-sm relative";
        
        const qrContainerId = `qrcode-${index}`;

        card.innerHTML = `
          <button onclick="removeSingleQR(${index})" class="no-print absolute top-1 right-1 text-gray-400 hover:text-rose-600 p-1">
            <i data-lucide="x-circle" class="w-3.5 h-3.5"></i>
          </button>
          <div id="${qrContainerId}" class="my-1"></div>
          <div class="w-full border-t border-gray-200 pt-1 mt-1">
            <div class="font-bold text-[11px] truncate uppercase text-black">${item.name}</div>
            <div class="text-[10px] font-mono font-bold text-gray-800">₹${item.price.toFixed(2)}</div>
          </div>
        `;

        grid.appendChild(card);

        // Generate QR code element
        new QRCode(document.getElementById(qrContainerId), {
          text: item.payload,
          width: 90,
          height: 90,
          correctLevel: QRCode.CorrectLevel.M
        });
      });

      lucide.createIcons();
    }

    function removeSingleQR(index) {
      qrItemsList.splice(index, 1);
      renderQRGrid();
    }

    function clearAllQRs() {
      qrItemsList = [];
      renderQRGrid();
    }
  </script>
</body>
</html>
