<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Streaming</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f0f0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .stream-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .live-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #e50914;
            color: #fff;
            padding: 5px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="stream-container">
        <div class="live-badge">LIVE</div>
        <!-- Autoplay, playsinline aur muted attributes se video bina click ke chalu ho jayega -->
        <video id="remoteVideo" autoplay playsinline muted controls></video>
    </div>

    <script>
        const remoteVideo = document.getElementById('remoteVideo');

        // पेज लोड होते ही लाइव स्ट्रीम ऑटो-प्ले होगी
        window.addEventListener('DOMContentLoaded', () => {
            remoteVideo.play().catch(err => {
                console.log("Autoplay started muted:", err);
            });
            
            // WebRTC Viewer Connection Logic यहाँ आएगा
        });
    </script>
</body>
</html>
