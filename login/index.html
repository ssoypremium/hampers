<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SSOY</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-white">Workshop Login</h2>
        
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold uppercase tracking-wider text-slate-400 mb-2">User ID</label>
                <div class="relative">
                    <input type="text" id="username" placeholder="Enter User ID" class="w-full p-3 pl-4 pr-11 py-2.5 text-sm rounded-xl bg-slate-900 border border-slate-600 border-slate-200 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="password" placeholder="Enter Password" class="w-full p-3 pl-4 pr-11 py-2.5 text-sm rounded-xl bg-slate-900 border border-slate-600 border-slate-200 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200" aria-label="Toggle password visibility">
                        <i id="toggleIcon" class="fa fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-sm rounded-xl transition duration-200 flex items-center justify-center space-x-2">
                <span>Login</span>
                <i class="fa fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div id="feedbackMessage" class="hidden mt-4 p-3 rounded-xl text-xs font-medium text-center transition-all duration-300"></div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Supabase Initialization
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Toggle Password Show/Hide
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Form Submission and Validation
        async function handleLogin(event) {
            event.preventDefault();
            // यहाँ आपका लॉगिन प्रमाणीकरण (authentication) कोड आएगा
        }
    </script>
</body>
</html>
