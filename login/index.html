<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 text-slate-800">

    <!-- Login Container Card -->
    <div class="w-full max-w-sm bg-white rounded-2xl p-6 sm:p-8 shadow-xl shadow-slate-200/50 border border-slate-100">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mx-auto mb-3">
                <i class="fas fa-user-lock text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-900">User Login</h1>
            <p class="text-xs text-slate-500 mt-1">Please enter your User ID & Password</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4" novalidate>
            
            <!-- User ID Input -->
            <div>
                <label for="userId" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">
                    User ID
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fas fa-user text-sm"></i>
                    </div>
                    <input 
                        type="text" 
                        id="userId" 
                        placeholder="Enter User ID" 
                        required 
                        class="w-full pl-10 pr-4 py-3 text-sm rounded-xl bg-slate-50 border border-slate-200 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all placeholder:text-slate-400"
                    >
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">
                    Password
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fas fa-lock text-sm"></i>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter Password" 
                        required 
                        class="w-full pl-10 pr-11 py-3 text-sm rounded-xl bg-slate-50 border border-slate-200 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all placeholder:text-slate-400"
                    >
                    <button 
                        type="button" 
                        onclick="togglePassword()" 
                        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors focus:outline-none"
                        aria-label="Toggle password visibility"
                    >
                        <i id="toggleIcon" class="fas fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-sm rounded-xl shadow-md shadow-blue-500/20 active:scale-[0.98] transition-all duration-200 mt-2 flex items-center justify-center gap-2"
            >
                <span>Login</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Feedback Message Area -->
        <div id="feedbackMessage" class="hidden mt-4 p-3 rounded-xl text-xs font-medium text-center transition-all"></div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // Toggle Password Show/Hide
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Form Submission and Validation
        function handleLogin(e) {
            e.preventDefault();

            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value.trim();
            const feedback = document.getElementById('feedbackMessage');

            // Reset Feedback Area
            feedback.className = "hidden mt-4 p-3 rounded-xl text-xs font-medium text-center transition-all";

            if (!userId && !password) {
                showFeedback("User ID और Password दर्ज करें।", "error");
                return;
            }

            if (!userId) {
                showFeedback("कृपया User ID दर्ज करें।", "error");
                return;
            }

            if (!password) {
                showFeedback("कृपया Password दर्ज करें।", "error");
                return;
            }

            // Simple Validation Demo
            showFeedback("लॉगिन सफल रहा! (Login Successful)", "success");
        }

        // Helper Function to Show Messages
        function showFeedback(message, type) {
            const feedback = document.getElementById('feedbackMessage');
            feedback.textContent = message;
            
            if (type === 'success') {
                feedback.className = "mt-4 p-3 rounded-xl text-xs font-medium text-center bg-emerald-50 text-emerald-700 border border-emerald-200 block";
            } else {
                feedback.className = "mt-4 p-3 rounded-xl text-xs font-medium text-center bg-rose-50 text-rose-700 border border-rose-200 block";
            }
        }
    </script>
</body>
</html>
