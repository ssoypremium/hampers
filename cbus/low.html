<script>
    let peer = null;
    let conn = null;
    let myPeerId = null;
    let html5QrcodeScanner = null;
    let pingInterval = null;

    // UI Selectors
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const qrCard = document.getElementById('qr-card');
    const qrContainer = document.getElementById('qrcode');
    const qrLoader = document.getElementById('qr-loader');
    const codeInput = document.getElementById('code-input');
    const btnSendCode = document.getElementById('btn-send-code');
    const btnPasteClipboard = document.getElementById('btn-paste-clipboard');
    const transferList = document.getElementById('transfer-list');
    const emptyState = document.getElementById('empty-state');
    const btnClearHistory = document.getElementById('btn-clear-history');
    const btnOpenScanner = document.getElementById('btn-open-scanner');
    const btnCloseScanner = document.getElementById('btn-close-scanner');
    const scannerModal = document.getElementById('scanner-modal');

    // Initialize Lucide Icons
    lucide.createIcons();

    // Check URL parameters for direct connect via QR scan link
    const urlParams = new URLSearchParams(window.location.search);
    const targetFromUrl = urlParams.get('connect');

    function initPeer() {
      // PeerJS options ke sath thoda stable configuration
      peer = new Peer({ 
        debug: 1,
        config: {
          'iceServers': [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' }
          ]
        }
      });

      peer.on('open', (id) => {
        myPeerId = id;
        qrLoader.classList.add('hidden');

        const currentUrl = window.location.origin + window.location.pathname;
        const connectUrl = `${currentUrl}?connect=${id}`;
        
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
          text: connectUrl,
          width: 150,
          height: 150,
          colorDark: "#0f172a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        updateStatus('waiting', 'Ready');

        if (targetFromUrl) {
          connectToPeer(targetFromUrl);
        }
      });

      peer.on('connection', (incomingConn) => {
        setupConnection(incomingConn);
      });

      peer.on('error', (err) => {
        console.error('PeerJS Error:', err);
        // Sirf critical error par status change karein
        if(err.type === 'peer-unavailable' || err.type === 'network') {
          updateStatus('waiting', 'Connection Lost');
        }
      });
    }

    function connectToPeer(targetId) {
      if (!targetId || targetId === myPeerId) return;
      updateStatus('connecting', 'Connecting...');
      const outgoingConn = peer.connect(targetId, { reliable: true });
      setupConnection(outgoingConn);
    }

    function setupConnection(connection) {
      // Agar pehle se koi connection hai to use band mat karo jab tak zaroori na ho
      if (conn && conn.open) {
        return;
      }
      conn = connection;

      conn.on('open', () => {
        updateStatus('connected', 'Connected');

        // QR Card hide karein aur dobara apne aap show na ho iske liye classes pakki karein
        if (qrCard) {
          qrCard.classList.add('opacity-0', 'scale-95', 'pointer-events-none', 'hidden');
        }

        // Keep-alive ping start karein taaki connection idle hone par drop na ho
        if (pingInterval) clearInterval(pingInterval);
        pingInterval = setInterval(() => {
          if (conn && conn.open) {
            conn.send({ type: 'ping' });
          }
        }, 10000); // Har 10 seconds mein ping
      });

      conn.on('data', (data) => {
        if (typeof data === 'object') {
          if (data.type === 'content') {
            renderContentMessage(data.content, 'received');
          }
          // Ping ignore kar do
        }
      });

      conn.on('close', () => {
        // Clear ping interval
        if (pingInterval) clearInterval(pingInterval);
        
        // Agar connection safely close hua hai tabhi status change karein
        updateStatus('waiting', 'Disconnected');
      });

      conn.on('error', (err) => {
        console.error('Connection error:', err);
      });
    }

    function updateStatus(state, message) {
      statusText.textContent = message;
      if (state === 'connected') {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-emerald-400';

        // Automatically hide QR Card when connected
        if (qrCard) {
          qrCard.classList.add('opacity-0', 'scale-95', 'pointer-events-none', 'hidden');
        }
      } else if (state === 'connecting') {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/30';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-indigo-400 animate-ping';
      } else {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';

        // Sirf tabhi QR card dikhayein jab sach mein disconnect ho gaya ho
        if (qrCard) {
          qrCard.classList.remove('opacity-0', 'scale-95', 'pointer-events-none', 'hidden');
        }
      }
    }

    function sendContent() {
      const text = codeInput.value.trim();
      if (!text) return;

      if (!conn || !conn.open) {
        alert('Please connect to a peer first by scanning their QR code.');
        return;
      }

      conn.send({ type: 'content', content: text });
      renderContentMessage(text, 'sent');
      codeInput.value = '';
    }

    function renderContentMessage(contentText, direction) {
      if (emptyState) emptyState.style.display = 'none';
      const isSent = direction === 'sent';
      const cardId = 'content-card-' + Math.random().toString(36).substr(2, 9);

      const card = document.createElement('div');
      card.className = `p-3 rounded-xl border text-xs flex flex-col gap-2 ${
        isSent 
          ? 'bg-indigo-950/30 border-indigo-800/40 text-indigo-100' 
          : 'bg-slate-950 border-slate-800 text-slate-100'
      }`;

      card.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-[10px] uppercase tracking-wider font-bold text-slate-400">${isSent ? 'Sent' : 'Received'}</span>
          <div class="flex items-center gap-2">
            <span class="text-[10px] text-slate-500">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            <button onclick="copySnippet('${cardId}')" id="btn-${cardId}" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md text-[11px] font-medium transition flex items-center gap-1">
              <i data-lucide="copy" class="w-3 h-3"></i> Copy
            </button>
          </div>
        </div>
        <pre id="${cardId}" class="bg-slate-900 p-3 rounded-lg overflow-x-auto text-[11px] font-mono text-slate-300 select-all border border-slate-800/80 max-h-48 whitespace-pre-wrap break-all"><code>${escapeHtml(contentText)}</code></pre>
      `;

      transferList.appendChild(card);
      lucide.createIcons();
      transferList.scrollTop = transferList.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.copySnippet = function(cardId) {
      const preEl = document.getElementById(cardId);
      const btnEl = document.getElementById('btn-' + cardId);
      const textToCopy = preEl.textContent;

      navigator.clipboard.writeText(textToCopy).then(() => {
        btnEl.innerHTML = `<i data-lucide="check" class="w-3 h-3 text-emerald-400"></i> Copied!`;
        btnEl.className = 'px-2.5 py-1 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 rounded-md text-[11px] font-medium transition flex items-center gap-1';
        lucide.createIcons();
        setTimeout(() => {
          btnEl.innerHTML = `<i data-lucide="copy" class="w-3 h-3"></i> Copy`;
          btnEl.className = 'px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md text-[11px] font-medium transition flex items-center gap-1';
          lucide.createIcons();
        }, 2000);
      });
    };

    // Quick Paste Button Action
    btnPasteClipboard.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          codeInput.value = text;
        }
      } catch (err) {
        alert('Paste permission denied. Please paste manually using Ctrl+V or long-press.');
      }
    });

    // Scanner Modal Handlers
    function openScanner() {
      scannerModal.classList.remove('hidden');
      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      }
      const config = { fps: 10, qrbox: { width: 180, height: 180 } };
      html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, () => {}).catch(err => {
        alert("Camera access failed or permission denied.");
        closeScanner();
      });
    }

    function closeScanner, () => {
      if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        html5QrcodeScanner.stop().then(() => scannerModal.classList.add('hidden')).catch(() => scannerModal.classList.add('hidden'));
      } else {
        scannerModal.classList.add('hidden');
      }
    }

    function onScanSuccess(decodedText) {
      let scannedPeerId = decodedText;
      try {
        if (decodedText.includes('connect=')) {
          const parsedUrl = new URL(decodedText);
          scannedPeerId = parsedUrl.searchParams.get('connect') || decodedText;
        }
      } catch (e) {}

      closeScanner();
      connectToPeer(scannedPeerId);
    }

    // Event Listeners
    btnSendCode.addEventListener('click', sendContent);
    codeInput.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') sendContent();
    });

    btnOpenScanner.addEventListener('click', openScanner);
    btnCloseScanner.addEventListener('click', closeScanner);

    btnClearHistory.addEventListener('click', () => {
      transferList.innerHTML = '';
      transferList.appendChild(emptyState);
      emptyState.style.display = 'flex';
    });

    window.addEventListener('load', initPeer);
  </script>
