<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Chess Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chess.js Library for Rules Validation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Chessboard styling */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 520px;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            user-select: none;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            font-size: 2.2rem;
            transition: background-color 0.15s ease;
        }

        @media (max-width: 480px) {
            .square {
                font-size: 1.6rem;
            }
        }

        .square.light {
            background-color: #f0d9b5;
            color: #262421;
        }

        .square.dark {
            background-color: #b58863;
            color: #262421;
        }

        .square.selected {
            background-color: #7b61ff !important;
        }

        .square.last-move {
            background-color: #aaa23a !important;
        }

        .square.highlight::after {
            content: '';
            position: absolute;
            width: 24%;
            height: 24%;
            background-color: rgba(20, 83, 45, 0.6);
            border-radius: 50%;
        }

        .square.highlight-capture::after {
            content: '';
            position: absolute;
            width: 85%;
            height: 85%;
            border: 4px solid rgba(185, 28, 28, 0.7);
            border-radius: 50%;
        }

        .piece {
            z-index: 10;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }

        .piece:hover {
            transform: scale(1.1);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 md:p-6">

    <!-- Header -->
    <header class="w-full max-w-5xl flex justify-between items-center mb-6 bg-slate-800/80 backdrop-blur p-4 rounded-xl border border-slate-700">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-chess-knight text-2xl text-indigo-400"></i>
            <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                P2P WebRTC Chess
            </h1>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Sound Toggle Button -->
            <button id="soundToggleBtn" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                <i id="soundIcon" class="fa-solid fa-volume-high text-indigo-400"></i>
                <span class="hidden sm:inline">Sound</span>
            </button>
            <!-- Connection Badge -->
            <div id="connectionStatusBadge" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="connectionStatusText">Disconnected</span>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Left Side: Connection & Controls -->
        <section class="lg:col-span-5 flex flex-col space-y-4">
            
            <!-- Connection Panel -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg">
                <h2 class="text-lg font-semibold mb-3 text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-network-wired text-indigo-400"></i> WebRTC P2P Setup
                </h2>
                
                <!-- Tab Switching for Setup -->
                <div class="flex border-b border-slate-700 mb-4">
                    <button id="tabHost" class="flex-1 py-2 text-sm font-medium border-b-2 border-indigo-500 text-indigo-400">1. Host Game</button>
                    <button id="tabJoin" class="flex-1 py-2 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200">2. Join Game</button>
                </div>

                <!-- Host View -->
                <div id="hostSection" class="space-y-3">
                    <p class="text-xs text-slate-400">Click below to generate a connection offer, then send it to your opponent.</p>
                    <button id="createOfferBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-lg transition shadow-md flex justify-center items-center gap-2">
                        <i class="fa-solid fa-plus-circle"></i> Create Game Offer
                    </button>
                    
                    <div id="offerOutputContainer" class="hidden space-y-2">
                        <label class="block text-xs font-medium text-slate-300">Your Offer Code (Send to Player 2):</label>
                        <div class="relative">
                            <textarea id="localOfferInput" readonly class="w-full h-20 p-2 text-xs bg-slate-900 border border-slate-700 rounded-lg text-slate-300 font-mono focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                            <button id="copyOfferBtn" class="absolute top-2 right-2 px-2 py-1 bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 rounded border border-slate-600">
                                <i class="fa-solid fa-copy"></i> Copy
                            </button>
                        </div>

                        <label class="block text-xs font-medium text-slate-300 pt-2">Paste Answer Code from Player 2:</label>
                        <textarea id="remoteAnswerInput" placeholder="Paste Answer code here..." class="w-full h-20 p-2 text-xs bg-slate-900 border border-slate-700 rounded-lg text-slate-300 font-mono focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                        <button id="acceptAnswerBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded-lg transition shadow-md flex justify-center items-center gap-2">
                            <i class="fa-solid fa-check-circle"></i> Connect to Player
                        </button>
                    </div>
                </div>

                <!-- Join View -->
                <div id="joinSection" class="hidden space-y-3">
                    <p class="text-xs text-slate-400">Paste the host's offer code to generate an answer code.</p>
                    <textarea id="remoteOfferInput" placeholder="Paste Host's Offer code here..." class="w-full h-20 p-2 text-xs bg-slate-900 border border-slate-700 rounded-lg text-slate-300 font-mono focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                    
                    <button id="createAnswerBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-lg transition shadow-md flex justify-center items-center gap-2">
                        <i class="fa-solid fa-key"></i> Generate Answer
                    </button>

                    <div id="answerOutputContainer" class="hidden space-y-2">
                        <label class="block text-xs font-medium text-slate-300">Your Answer Code (Send back to Host):</label>
                        <div class="relative">
                            <textarea id="localAnswerInput" readonly class="w-full h-20 p-2 text-xs bg-slate-900 border border-slate-700 rounded-lg text-slate-300 font-mono focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                            <button id="copyAnswerBtn" class="absolute top-2 right-2 px-2 py-1 bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 rounded border border-slate-600">
                                <i class="fa-solid fa-copy"></i> Copy
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Match Status & Player Role -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">Your Side:</span>
                    <span id="playerRoleText" class="font-bold text-slate-200">Unassigned</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">Turn:</span>
                    <span id="currentTurnText" class="font-bold text-indigo-400">White's Turn</span>
                </div>
                <div id="gameAlertBox" class="hidden p-2.5 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-xs text-indigo-300 text-center font-medium">
                    --
                </div>
            </div>

            <!-- Move History -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg flex-1 min-h-[160px] flex flex-col">
                <h3 class="text-sm font-semibold text-slate-300 mb-2 flex items-center justify-between">
                    <span><i class="fa-solid fa-list-ol text-indigo-400 mr-1"></i> Move History</span>
                    <button id="flipBoardBtn" class="text-xs text-slate-400 hover:text-indigo-400 transition"><i class="fa-solid fa-rotate"></i> Flip View</button>
                </h3>
                <div id="moveHistoryList" class="flex-1 bg-slate-900/60 rounded-lg p-2 text-xs text-slate-300 overflow-y-auto max-h-40 font-mono grid grid-cols-2 gap-x-4 gap-y-1">
                    <!-- Moves added dynamically -->
                </div>
            </div>
        </section>

        <!-- Right Side: Chessboard Container -->
        <section class="lg:col-span-7 flex flex-col items-center justify-center">
            
            <!-- Opponent Profile Box -->
            <div class="w-full max-w-[520px] mb-2 flex justify-between items-center bg-slate-800/60 p-2.5 rounded-t-lg border border-slate-700">
                <div class="flex items-center space-x-2">
                    <div id="opponentAvatar" class="w-7 h-7 rounded-full bg-slate-600 flex items-center justify-center text-xs text-slate-200 font-bold">O</div>
                    <span id="opponentName" class="text-sm font-medium text-slate-300">Opponent</span>
                </div>
                <div id="capturedByOpponent" class="flex text-lg space-x-1 min-h-[1.75rem] items-center"></div>
            </div>

            <!-- Board Element -->
            <div id="chessboard" class="board-grid border-2 border-slate-700">
                <!-- 64 Squares generated dynamically -->
            </div>

            <!-- Self Profile Box -->
            <div class="w-full max-w-[520px] mt-2 flex justify-between items-center bg-slate-800/60 p-2.5 rounded-b-lg border border-slate-700">
                <div class="flex items-center space-x-2">
                    <div id="selfAvatar" class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-xs text-white font-bold">Y</div>
                    <span id="selfName" class="text-sm font-medium text-slate-300">You</span>
                </div>
                <div id="capturedBySelf" class="flex text-lg space-x-1 min-h-[1.75rem] items-center"></div>
            </div>

        </section>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // Global Game & WebRTC State
        let game = new Chess();
        let peerConnection = null;
        let dataChannel = null;
        let myRole = 'w'; // Default host is White ('w'), joiner is Black ('b')
        let isBoardFlipped = false;
        let selectedSquare = null;
        let validMovesForSelected = [];
        let soundEnabled = true;

        // WebRTC STUN Server configuration
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Chess piece unicode mapping
        const pieceUnicode = {
            'w': { 'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚' },
            'b': { 'p': '♙', 'r': '♖', 'n': '♘', 'b': '♗', 'q': '♕', 'k': '♔' }
        };

        // Audio synthesis for moves (No external audio file dependencies)
        function playMoveSound(isCapture = false) {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = isCapture ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(isCapture ? 150 : 300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(isCapture ? 60 : 120, ctx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {
                console.warn('Audio context error:', e);
            }
        }

        // Initialize WebRTC DataChannel Events
        function setupDataChannelEvents() {
            if (!dataChannel) return;

            dataChannel.onopen = () => {
                console.log('Data Channel Open');
                updateConnectionStatus('Connected', 'connected');
                showAlert('Connection established! You can now play.', 'success');
            };

            dataChannel.onclose = () => {
                console.log('Data Channel Closed');
                updateConnectionStatus('Disconnected', 'disconnected');
                showAlert('Opponent disconnected.', 'error');
            };

            dataChannel.onerror = (err) => {
                console.error('Data Channel Error:', err);
            };

            dataChannel.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    if (message.type === 'move') {
                        handleOpponentMove(message.move);
                    }
                } catch (err) {
                    console.error('Failed to parse WebRTC message:', err);
                }
            };
        }

        // Handle WebRTC Host Setup
        async function createHostOffer() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            // Create DataChannel (Host creates the channel)
            dataChannel = peerConnection.createDataChannel('chessDataChannel');
            setupDataChannelEvents();

            peerConnection.onicecandidate = (event) => {
                if (!event.candidate) {
                    // ICE Gathering completed, output complete offer
                    const offerSdp = btoa(JSON.stringify(peerConnection.localDescription));
                    document.getElementById('localOfferInput').value = offerSdp;
                    document.getElementById('offerOutputContainer').classList.remove('hidden');
                }
            };

            myRole = 'w'; // Host plays White
            isBoardFlipped = false;
            updateRoleUI();

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
        }

        // Host accepts Answer from Joiner
        async function acceptJoinerAnswer() {
            const answerInput = document.getElementById('remoteAnswerInput').value.trim();
            if (!answerInput) {
                showAlert('Please paste the Answer code from Player 2', 'error');
                return;
            }

            try {
                const answerObj = JSON.parse(atob(answerInput));
                await peerConnection.setRemoteDescription(new RTCSessionDescription(answerObj));
                showAlert('Connecting to Player 2...', 'info');
            } catch (err) {
                showAlert('Invalid Answer code. Please re-copy.', 'error');
            }
        }

        // Handle WebRTC Joiner Setup
        async function createJoinerAnswer() {
            const offerInput = document.getElementById('remoteOfferInput').value.trim();
            if (!offerInput) {
                showAlert('Please paste Host Offer code first', 'error');
                return;
            }

            peerConnection = new RTCPeerConnection(rtcConfig);

            // Listen for incoming DataChannel
            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupDataChannelEvents();
            };

            peerConnection.onicecandidate = (event) => {
                if (!event.candidate) {
                    // ICE Gathering completed, output complete answer
                    const answerSdp = btoa(JSON.stringify(peerConnection.localDescription));
                    document.getElementById('localAnswerInput').value = answerSdp;
                    document.getElementById('answerOutputContainer').classList.remove('hidden');
                }
            };

            try {
                const offerObj = JSON.parse(atob(offerInput));
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offerObj));

                myRole = 'b'; // Joiner plays Black
                isBoardFlipped = true;
                updateRoleUI();

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
            } catch (err) {
                showAlert('Invalid Offer code. Please re-copy.', 'error');
            }
        }

        // Receive & Apply Opponent Move
        function handleOpponentMove(moveObj) {
            const result = game.move(moveObj);
            if (result) {
                playMoveSound(result.captured !== undefined);
                selectedSquare = null;
                validMovesForSelected = [];
                renderBoard();
                updateGameStatus();
            }
        }

        // Execute local player move and sync via DataChannel
        function makeLocalMove(fromSquare, toSquare, promotion = 'q') {
            const moveObj = { from: fromSquare, to: toSquare, promotion };
            const result = game.move(moveObj);

            if (result) {
                playMoveSound(result.captured !== undefined);
                selectedSquare = null;
                validMovesForSelected = [];

                // Send move over WebRTC if connected
                if (dataChannel && dataChannel.readyState === 'open') {
                    dataChannel.send(JSON.stringify({
                        type: 'move',
                        move: moveObj
                    }));
                }

                renderBoard();
                updateGameStatus();
            }
        }

        // Render Chessboard UI
        function renderBoard() {
            const boardElement = document.getElementById('chessboard');
            boardElement.innerHTML = '';

            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];

            const effectiveRanks = isBoardFlipped ? [...ranks].reverse() : ranks;
            const effectiveFiles = isBoardFlipped ? [...files].reverse() : files;

            const history = game.history({ verbose: true });
            const lastMove = history.length > 0 ? history[history.length - 1] : null;

            effectiveRanks.forEach((rank, rIdx) => {
                effectiveFiles.forEach((file, fIdx) => {
                    const squareCoord = file + rank;
                    const squarePiece = game.get(squareCoord);

                    const squareDiv = document.createElement('div');
                    const isLight = (files.indexOf(file) + ranks.indexOf(rank)) % 2 === 0;
                    
                    squareDiv.className = `square ${isLight ? 'light' : 'dark'}`;
                    squareDiv.dataset.square = squareCoord;

                    // Last move highlight
                    if (lastMove && (lastMove.from === squareCoord || lastMove.to === squareCoord)) {
                        squareDiv.classList.add('last-move');
                    }

                    // Selection highlight
                    if (selectedSquare === squareCoord) {
                        squareDiv.classList.add('selected');
                    }

                    // Valid moves highlights
                    if (validMovesForSelected.some(m => m.to === squareCoord)) {
                        if (squarePiece) {
                            squareDiv.classList.add('highlight-capture');
                        } else {
                            squareDiv.classList.add('highlight');
                        }
                    }

                    // Piece rendering
                    if (squarePiece) {
                        const pieceSpan = document.createElement('span');
                        pieceSpan.className = 'piece';
                        pieceSpan.textContent = pieceUnicode[squarePiece.color][squarePiece.type];
                        
                        // Add styling distinction for white/black pieces
                        if (squarePiece.color === 'w') {
                            pieceSpan.style.color = '#ffffff';
                            pieceSpan.style.textShadow = '0 0 2px #000';
                        } else {
                            pieceSpan.style.color = '#1a1a1a';
                        }

                        squareDiv.appendChild(pieceSpan);
                    }

                    // Square Click Listener
                    squareDiv.addEventListener('click', () => handleSquareClick(squareCoord));

                    boardElement.appendChild(squareDiv);
                });
            });

            renderMoveHistory();
            renderCapturedPieces();
        }

        // Handle square clicks for moves
        function handleSquareClick(square) {
            const currentTurn = game.turn();

            // Enforce turn turn-based restrictions
            if (currentTurn !== myRole) {
                showAlert("It's your opponent's turn!", 'info');
                return;
            }

            const pieceOnSquare = game.get(square);

            // If selecting a piece of current player's color
            if (pieceOnSquare && pieceOnSquare.color === myRole) {
                selectedSquare = square;
                validMovesForSelected = game.moves({ square: square, verbose: true });
                renderBoard();
                return;
            }

            // If clicking a square to make a move
            if (selectedSquare) {
                const isValid = validMovesForSelected.some(m => m.to === square);
                if (isValid) {
                    makeLocalMove(selectedSquare, square);
                } else {
                    selectedSquare = null;
                    validMovesForSelected = [];
                    renderBoard();
                }
            }
        }

        // Update turn display & checkmate warnings
        function updateGameStatus() {
            const turnText = document.getElementById('currentTurnText');
            const alertBox = document.getElementById('gameAlertBox');

            const currentTurnColor = game.turn() === 'w' ? 'White' : 'Black';
            turnText.textContent = `${currentTurnColor}'s Turn`;

            if (game.in_checkmate()) {
                showAlert(`Checkmate! ${game.turn() === 'w' ? 'Black' : 'White'} wins!`, 'error');
            } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
                showAlert('Game over: Draw / Stalemate.', 'info');
            } else if (game.in_check()) {
                showAlert(`${currentTurnColor} is in Check!`, 'warning');
            } else {
                alertBox.classList.add('hidden');
            }
        }

        // Render captured pieces
        function renderCapturedPieces() {
            const history = game.history({ verbose: true });
            const capturedByWhite = [];
            const capturedByBlack = [];

            history.forEach(m => {
                if (m.captured) {
                    if (m.color === 'w') {
                        capturedByWhite.push(pieceUnicode['b'][m.captured]);
                    } else {
                        capturedByBlack.push(pieceUnicode['w'][m.captured]);
                    }
                }
            });

            const selfCaptured = myRole === 'w' ? capturedByWhite : capturedByBlack;
            const oppCaptured = myRole === 'w' ? capturedByBlack : capturedByWhite;

            document.getElementById('capturedBySelf').textContent = selfCaptured.join(' ');
            document.getElementById('capturedByOpponent').textContent = oppCaptured.join(' ');
        }

        // Render formatted move history table
        function renderMoveHistory() {
            const history = game.history();
            const historyContainer = document.getElementById('moveHistoryList');
            historyContainer.innerHTML = '';

            for (let i = 0; i < history.length; i += 2) {
                const moveNum = Math.floor(i / 2) + 1;
                const whiteMove = history[i] || '';
                const blackMove = history[i + 1] || '';

                const row = document.createElement('div');
                row.className = 'flex justify-between py-0.5 border-b border-slate-800/50';
                row.innerHTML = `<span class="text-slate-500">${moveNum}.</span><span>${whiteMove}</span><span class="text-slate-400">${blackMove}</span>`;
                historyContainer.appendChild(row);
            }
            historyContainer.scrollTop = historyContainer.scrollHeight;
        }

        // Helper: Connection Status UI
        function updateConnectionStatus(text, statusClass) {
            const badge = document.getElementById('connectionStatusBadge');
            const label = document.getElementById('connectionStatusText');

            label.textContent = text;
            badge.className = 'px-3 py-1.5 rounded-full text-xs font-semibold flex items-center space-x-1.5 ';

            if (statusClass === 'connected') {
                badge.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
            } else {
                badge.classList.add('bg-amber-500/10', 'text-amber-400', 'border', 'border-amber-500/20');
            }
        }

        // Helper: Show UI Notifications
        function showAlert(msg, type = 'info') {
            const alertBox = document.getElementById('gameAlertBox');
            alertBox.classList.remove('hidden', 'bg-indigo-500/10', 'text-indigo-300', 'bg-rose-500/10', 'text-rose-300', 'bg-amber-500/10', 'text-amber-300');

            if (type === 'error') {
                alertBox.classList.add('bg-rose-500/10', 'text-rose-300', 'border-rose-500/20');
            } else if (type === 'warning') {
                alertBox.classList.add('bg-amber-500/10', 'text-amber-300', 'border-amber-500/20');
            } else {
                alertBox.classList.add('bg-indigo-500/10', 'text-indigo-300', 'border-indigo-500/20');
            }

            alertBox.textContent = msg;
        }

        // Helper: Update Player Roles UI
        function updateRoleUI() {
            const roleLabel = document.getElementById('playerRoleText');
            roleLabel.textContent = myRole === 'w' ? 'White (P1)' : 'Black (P2)';
            renderBoard();
        }

        // Clipboard Copy Helper
        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).value;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showAlert('Code copied to clipboard!', 'info');
            }).catch(() => {
                // Fallback for iframe/restricted context
                const el = document.getElementById(elementId);
                el.select();
                document.execCommand('copy');
                showAlert('Code copied to clipboard!', 'info');
            });
        }

        // Event Listeners setup
        window.addEventListener('DOMContentLoaded', () => {
            renderBoard();

            // Tab switching
            const tabHost = document.getElementById('tabHost');
            const tabJoin = document.getElementById('tabJoin');
            const hostSec = document.getElementById('hostSection');
            const joinSec = document.getElementById('joinSection');

            tabHost.addEventListener('click', () => {
                tabHost.classList.add('border-indigo-500', 'text-indigo-400');
                tabHost.classList.remove('border-transparent', 'text-slate-400');
                tabJoin.classList.add('border-transparent', 'text-slate-400');
                tabJoin.classList.remove('border-indigo-500', 'text-indigo-400');
                hostSec.classList.remove('hidden');
                joinSec.classList.add('hidden');
            });

            tabJoin.addEventListener('click', () => {
                tabJoin.classList.add('border-indigo-500', 'text-indigo-400');
                tabJoin.classList.remove('border-transparent', 'text-slate-400');
                tabHost.classList.add('border-transparent', 'text-slate-400');
                tabHost.classList.remove('border-indigo-500', 'text-indigo-400');
                joinSec.classList.remove('hidden');
                hostSec.classList.add('hidden');
            });

            // Action Buttons
            document.getElementById('createOfferBtn').addEventListener('click', createHostOffer);
            document.getElementById('acceptAnswerBtn').addEventListener('click', acceptJoinerAnswer);
            document.getElementById('createAnswerBtn').addEventListener('click', createJoinerAnswer);

            document.getElementById('copyOfferBtn').addEventListener('click', () => copyToClipboard('localOfferInput'));
            document.getElementById('copyAnswerBtn').addEventListener('click', () => copyToClipboard('localAnswerInput'));

            document.getElementById('flipBoardBtn').addEventListener('click', () => {
                isBoardFlipped = !isBoardFlipped;
                renderBoard();
            });

            document.getElementById('soundToggleBtn').addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                const icon = document.getElementById('soundIcon');
                if (soundEnabled) {
                    icon.className = 'fa-solid fa-volume-high text-indigo-400';
                } else {
                    icon.className = 'fa-solid fa-volume-xmark text-slate-500';
                }
            });
        });
    </script>
</body>
</html>
