<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O2 Code Share</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PeerJS for WebRTC Peer-to-Peer Connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- QRCode.js for QR Code Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- HTML5-QRCode for In-App QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    #reader video {
      border-radius: 0.75rem;
      object-fit: cover;
      width: 100% !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-start p-4 md:p-6 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="w-full max-w-xl mb-6 flex items-center justify-between border-b border-slate-800 pb-4">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
        <i data-lucide="code" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-wide bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">O2</h1>
        <p class="text-[11px] text-slate-400">Instant O2 Code Share</p>
      </div>
    </div>

    <!-- Connection Status Badge -->
    <div id="status-badge" class="flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700">
      <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
      <span id="status-text">Initializing...</span>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="w-full max-w-xl flex flex-col gap-6">

    <!-- QR Handshake Card -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col items-center text-center relative overflow-hidden">
      <div class="absolute -right-10 -top-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>

      <h2 class="text-lg font-bold text-slate-100 mb-1">Pair Devices</h2>
      <p class="text-xs text-slate-400 mb-4 max-w-xs leading-relaxed">
        Scan this QR code from another device to connect instantly.
      </p>

      <!-- QR Code Box -->
      <div class="bg-white p-3 rounded-xl shadow-2xl border-4 border-slate-800 mb-4 relative min-h-[160px] min-w-[160px] flex items-center justify-center">
        <div id="qrcode"></div>
        <div id="qr-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 text-slate-400 rounded-lg">
          <i data-lucide="loader-2" class="w-7 h-7 animate-spin text-indigo-400 mb-2"></i>
          <span class="text-xs">Generating ID...</span>
        </div>
      </div>

      <!-- Scan QR Code Button -->
      <button id="btn-open-scanner" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
        <i data-lucide="qr-code" class="w-4 h-4"></i>
        Scan QR Code with Camera
      </button>
    </div>

    <!-- Code / Text Input Section -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <label for="code-input" class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
          <i data-lucide="terminal" class="w-4 h-4 text-cyan-400"></i>
          Paste Code or Text
        </label>
        <select id="code-type" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-[11px] text-slate-300 focus:outline-none focus:border-indigo-500">
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="javascript">JavaScript</option>
          <option value="text">Plain Text</option>
        </select>
      </div>

      <textarea id="code-input" rows="5" placeholder="Paste your code here..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 placeholder-slate-600 font-mono focus:outline-none focus:border-indigo-500 resize-y"></textarea>

      <button id="btn-send-code" class="w-full py-2.5 px-4 bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
        <i data-lucide="send" class="w-4 h-4"></i>
        Send Code to Peer
      </button>
    </div>

    <!-- Shared Code / Transfer Activity Section -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 flex flex-col min-h-[220px]">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-xs font-semibold text-slate-200 flex items-center gap-2">
          <i data-lucide="file-code" class="w-4 h-4 text-indigo-400"></i>
          Shared Code & Messages
        </h3>
        <button id="btn-clear-history" class="text-xs text-slate-500 hover:text-slate-300 transition flex items-center gap-1">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          Clear
        </button>
      </div>

      <!-- Activity Log List -->
      <div id="transfer-list" class="flex-1 space-y-3 overflow-y-auto max-h-[350px] pr-1">
        <div id="empty-state" class="h-full min-h-[140px] flex flex-col items-center justify-center text-slate-600 text-center">
          <i data-lucide="inbox" class="w-8 h-8 mb-2 opacity-40"></i>
          <p class="text-xs">No code or text shared yet.</p>
        </div>
      </div>
    </div>

  </main>

  <!-- MODAL: Camera Scanner -->
  <div id="scanner-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full shadow-2xl flex flex-col gap-4 relative">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
          <i data-lucide="camera" class="w-4 h-4 text-indigo-400"></i>
          Scan QR Code
        </h3>
        <button id="btn-close-scanner" class="text-slate-400 hover:text-white transition p-1 rounded-lg hover:bg-slate-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="overflow-hidden rounded-xl bg-slate-950 min-h-[220px] border border-slate-800 flex items-center justify-center relative">
        <div id="reader" class="w-full"></div>
      </div>

      <p class="text-[11px] text-slate-400 text-center">Point your camera at the QR code displayed on the other device.</p>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    let peer = null;
    let conn = null;
    let myPeerId = null;
    let html5QrcodeScanner = null;

    // UI Selectors
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const qrContainer = document.getElementById('qrcode');
    const qrLoader = document.getElementById('qr-loader');
    const codeInput = document.getElementById('code-input');
    const codeTypeSelect = document.getElementById('code-type');
    const btnSendCode = document.getElementById('btn-send-code');
    const transferList = document.getElementById('transfer-list');
    const emptyState = document.getElementById('empty-state');
    const btnClearHistory = document.getElementById('btn-clear-history');
    const btnOpenScanner = document.getElementById('btn-open-scanner');
    const btnCloseScanner = document.getElementById('btn-close-scanner');
    const scannerModal = document.getElementById('scanner-modal');

    // Initialize Lucide Icons
    lucide.createIcons();

    // Check URL parameters for direct connect via QR scan link
    const urlParams = new URLSearchParams(window.location.search);
    const targetFromUrl = urlParams.get('connect');

    function initPeer() {
      peer = new Peer({ debug: 1 });

      peer.on('open', (id) => {
        myPeerId = id;
        qrLoader.classList.add('hidden');

        const currentUrl = window.location.origin + window.location.pathname;
        const connectUrl = `${currentUrl}?connect=${id}`;
        
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
          text: connectUrl,
          width: 150,
          height: 150,
          colorDark: "#0f172a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        updateStatus('waiting', 'Ready');

        if (targetFromUrl) {
          connectToPeer(targetFromUrl);
        }
      });

      peer.on('connection', (incomingConn) => {
        setupConnection(incomingConn);
      });

      peer.on('error', (err) => {
        console.error('PeerJS Error:', err);
        updateStatus('error', 'Connection Error');
      });
    }

    function connectToPeer(targetId) {
      if (!targetId || targetId === myPeerId) return;
      updateStatus('connecting', 'Connecting...');
      const outgoingConn = peer.connect(targetId, { reliable: true });
      setupConnection(outgoingConn);
    }

    function setupConnection(connection) {
      conn = connection;

      conn.on('open', () => {
        updateStatus('connected', 'Connected');
      });

      conn.on('data', (data) => {
        if (typeof data === 'object' && data.type === 'code') {
          renderCodeMessage(data.content, data.lang, 'received');
        }
      });

      conn.on('close', () => {
        updateStatus('waiting', 'Disconnected');
      });
    }

    function updateStatus(state, message) {
      statusText.textContent = message;
      if (state === 'connected') {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-emerald-400';
      } else if (state === 'connecting') {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/30';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-indigo-400 animate-ping';
      } else {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';
      }
    }

    function sendCode() {
      const text = codeInput.value.trim();
      const lang = codeTypeSelect.value;
      if (!text) return;

      if (!conn || !conn.open) {
        alert('Please connect to a peer first by scanning their QR code.');
        return;
      }

      conn.send({ type: 'code', content: text, lang: lang });
      renderCodeMessage(text, lang, 'sent');
      codeInput.value = '';
    }

    function renderCodeMessage(codeText, lang, direction) {
      if (emptyState) emptyState.style.display = 'none';
      const isSent = direction === 'sent';
      const cardId = 'code-card-' + Math.random().toString(36).substr(2, 9);

      const card = document.createElement('div');
      card.className = `p-3 rounded-xl border text-xs flex flex-col gap-2 ${
        isSent 
          ? 'bg-indigo-950/30 border-indigo-800/40 text-indigo-100' 
          : 'bg-slate-950 border-slate-800 text-slate-100'
      }`;

      card.innerHTML = `
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 rounded uppercase text-[10px] font-bold ${
              lang === 'html' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/30' :
              lang === 'css' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' :
              lang === 'javascript' ? 'bg-yellow-500/25 text-yellow-400 border border-yellow-500/30' :
              'bg-slate-700 text-slate-300'
            }">${lang}</span>
            <span class="text-[10px] text-slate-400">${isSent ? 'Sent' : 'Received'}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[10px] text-slate-500">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            <button onclick="copySnippet('${cardId}')" id="btn-${cardId}" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md text-[11px] font-medium transition flex items-center gap-1">
              <i data-lucide="copy" class="w-3 h-3"></i> Copy Code
            </button>
          </div>
        </div>
        <pre id="${cardId}" class="bg-slate-900 p-3 rounded-lg overflow-x-auto text-[11px] font-mono text-slate-300 select-all border border-slate-800/80 max-h-48"><code>${escapeHtml(codeText)}</code></pre>
      `;

      transferList.appendChild(card);
      lucide.createIcons();
      transferList.scrollTop = transferList.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.copySnippet = function(cardId) {
      const preEl = document.getElementById(cardId);
      const btnEl = document.getElementById('btn-' + cardId);
      const textToCopy = preEl.textContent;

      navigator.clipboard.writeText(textToCopy).then(() => {
        btnEl.innerHTML = `<i data-lucide="check" class="w-3 h-3 text-emerald-400"></i> Copied!`;
        btnEl.className = 'px-2.5 py-1 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 rounded-md text-[11px] font-medium transition flex items-center gap-1';
        lucide.createIcons();
        setTimeout(() => {
          btnEl.innerHTML = `<i data-lucide="copy" class="w-3 h-3"></i> Copy Code`;
          btnEl.className = 'px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md text-[11px] font-medium transition flex items-center gap-1';
          lucide.createIcons();
        }, 2000);
      });
    };

    // Scanner Modal Handlers
    function openScanner() {
      scannerModal.classList.remove('hidden');
      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      }
      const config = { fps: 10, qrbox: { width: 180, height: 180 } };
      html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, () => {}).catch(err => {
        alert("Camera access failed or permission denied.");
        closeScanner();
      });
    }

    function closeScanner() {
      if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        html5QrcodeScanner.stop().then(() => scannerModal.classList.add('hidden')).catch(() => scannerModal.classList.add('hidden'));
      } else {
        scannerModal.classList.add('hidden');
      }
    }

    function onScanSuccess(decodedText) {
      let scannedPeerId = decodedText;
      try {
        if (decodedText.includes('connect=')) {
          const parsedUrl = new URL(decodedText);
          scannedPeerId = parsedUrl.searchParams.get('connect') || decodedText;
        }
      } catch (e) {}

      closeScanner();
      connectToPeer(scannedPeerId);
    }

    // Event Listeners
    btnSendCode.addEventListener('click', sendCode);
    codeInput.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') sendCode();
    });

    btnOpenScanner.addEventListener('click', openScanner);
    btnCloseScanner.addEventListener('click', closeScanner);

    btnClearHistory.addEventListener('click', () => {
      transferList.innerHTML = '';
      transferList.appendChild(emptyState);
      emptyState.style.display = 'flex';
    });

    window.addEventListener('load', initPeer);
  </script>
</body>
</html>
