<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone 1 - Caller</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
    .card { background: #fff; padding: 25px; border-radius: 12px; max-width: 380px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    button { padding: 12px 24px; margin: 10px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .call-btn { background-color: #28a745; color: white; }
    .end-btn { background-color: #dc3545; color: white; }
    .status { margin-top: 15px; font-size: 18px; color: #333; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Phone 1 (Caller)</h2>
    <button id="callBtn" class="call-btn" onclick="makeCall()">Phone 2 को कॉल करें</button>
    <button id="endBtn" class="end-btn" onclick="endCall()" disabled>कॉल एंड करें</button>
    <div id="status" class="status">स्थिति: तैयार</div>
  </div>

  <audio id="localAudio" autoplay muted></audio>
  <audio id="remoteAudio" autoplay></audio>

  <script>
    // Firebase Config (यहाँ अपनी Firebase प्रोजेक्ट की डिटेल्स डालें)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let localStream, pc, sessionRef;
    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    async function makeCall() {
      document.getElementById('status').innerText = "Phone 2 पर कॉल जा रही है...";
      document.getElementById('callBtn').disabled = true;
      document.getElementById('endBtn').disabled = false;

      // निश्चित कॉल ID का उपयोग
      sessionRef = database.ref('active_calls/main_call');
      await sessionRef.remove(); // पुरानी कॉल डेटा साफ़ करें

      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      document.getElementById('localAudio').srcObject = localStream;

      pc = new RTCPeerConnection(servers);

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.ontrack = event => {
        document.getElementById('remoteAudio').srcObject = event.streams[0];
      };

      pc.onicecandidate = event => {
        if (event.candidate) {
          sessionRef.child('callerCandidates').push(event.candidate.toJSON());
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      await sessionRef.set({
        status: 'ringing',
        offer: { type: offer.type, sdp: offer.sdp }
      });

      // Answer का इंतज़ार करें
      sessionRef.child('answer').on('value', async snapshot => {
        const data = snapshot.val();
        if (data && !pc.currentRemoteDescription) {
          await pc.setRemoteDescription(new RTCSessionDescription(data));
          document.getElementById('status').innerText = "कॉल कनेक्ट हो गई (Connected)";
        }
      });

      // Phone 2 के ICE Candidates सुनें
      sessionRef.child('calleeCandidates').on('child_added', snapshot => {
        const candidate = new RTCIceCandidate(snapshot.val());
        pc.addIceCandidate(candidate);
      });
    }

    function endCall() {
      if (sessionRef) {
        sessionRef.child('status').set('ended');
      }
      cleanup();
    }

    function cleanup() {
      if (pc) { pc.close(); pc = null; }
      if (localStream) { localStream.getTracks().forEach(track => track.stop()); }
      document.getElementById('status').innerText = "कॉल समाप्त (Ended)";
      document.getElementById('callBtn').disabled = false;
      document.getElementById('endBtn').disabled = true;
    }
  </script>
</body>
</html>
