<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirShare - Receiver (Client)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-emerald-600 rounded-lg text-white">
          <i class="fa-solid fa-download text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-xl leading-tight">AirShare</h1>
          <p class="text-xs text-emerald-400 font-medium">Receiver Mode (Client)</p>
        </div>
      </div>
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Ready
      </span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 py-8 w-full flex-1 space-y-6">
    
    <!-- Code Form -->
    <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur">
      <h2 class="text-lg font-semibold text-white mb-2 flex items-center gap-2">
        <i class="fa-solid fa-key text-emerald-400"></i> Enter Share Code
      </h2>
      <p class="text-xs text-slate-400 mb-4">Enter the 4-digit code provided by the sender.</p>
      
      <form id="receiveForm" class="flex gap-3">
        <input type="text" id="codeInput" maxlength="4" placeholder="1234" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-xl font-mono font-bold tracking-widest text-slate-100 focus:outline-none focus:border-emerald-500 transition uppercase">
        <button type="submit" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-medium text-sm rounded-xl transition flex items-center gap-2 shrink-0 shadow-lg shadow-emerald-600/20">
          <i class="fa-solid fa-arrow-down text-sm"></i> Fetch
        </button>
      </form>
    </div>

    <!-- Output Section (Hidden initially) -->
    <div id="outputCard" class="hidden bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur space-y-4">
      <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
        <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-circle-check"></i> Data Received
        </span>
        <button id="copyContentBtn" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium transition inline-flex items-center gap-1.5">
          <i class="fa-regular fa-copy"></i> Copy Text
        </button>
      </div>

      <div id="contentDisplay" class="bg-slate-900 border border-slate-700/50 rounded-xl p-4 text-sm text-slate-200 font-mono whitespace-pre-wrap break-all max-h-80 overflow-y-auto"></div>
    </div>

    <!-- Error/Status Message -->
    <div id="statusMsg" class="hidden text-center text-sm py-3 px-4 rounded-xl border"></div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    AirShare Client &bull; Realtime Receive
  </footer>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAOLu6jKoNCEibDrpZbV-KbucPlt8HZSkQ",
      authDomain: "airshare-279eb.firebaseapp.com",
      databaseURL: "https://airshare-279eb-default-rtdb.firebaseio.com",
      projectId: "airshare-279eb",
      storageBucket: "airshare-279eb.firebasestorage.app",
      messagingSenderId: "344144076433",
      appId: "1:344144076433:web:4a37b569bf2b358b3e6930"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const receiveForm = document.getElementById('receiveForm');
    const codeInput = document.getElementById('codeInput');
    const outputCard = document.getElementById('outputCard');
    const contentDisplay = document.getElementById('contentDisplay');
    const copyContentBtn = document.getElementById('copyContentBtn');
    const statusMsg = document.getElementById('statusMsg');

    function showStatus(message, isError = false) {
      statusMsg.textContent = message;
      statusMsg.className = `text-center text-sm py-3 px-4 rounded-xl border ${isError ? 'bg-rose-950/40 border-rose-500/30 text-rose-300' : 'bg-indigo-950/40 border-indigo-500/30 text-indigo-300'}`;
      statusMsg.classList.remove('hidden');
    }

    receiveForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = codeInput.value.trim();
      if(!code) return;

      statusMsg.classList.add('hidden');
      outputCard.classList.add('hidden');

      try {
        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, `shares/${code}`));

        if (snapshot.exists()) {
          const data = snapshot.val();
          contentDisplay.textContent = data.content;
          outputCard.classList.remove('hidden');
        } else {
          showStatus("No shared content found for this code. Please check and try again.", true);
        }
      } catch (error) {
        showStatus("Error fetching data: " + error.message, true);
      }
    });

    copyContentBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(contentDisplay.textContent);
      copyContentBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> Copied!';
      setTimeout(() => {
        copyContentBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy Text';
      }, 2000);
    });
  </script>
</body>
</html>
