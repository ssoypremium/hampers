<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPS Map Camera Lite</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Inter & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    .mono-font {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Modal / Edit backdrop */
    .edit-modal {
      backdrop-filter: blur(8px);
      background: rgba(15, 23, 42, 0.75);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none">

  <header class="w-full bg-slate-900/90 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-30">
    <div class="flex items-center space-x-2">
      <div class="w-3 h-3 rounded-none bg-emerald-500"></div>
      <span class="font-semibold tracking-wider text-sm">GPS MAP CAMERA LITE</span>
    </div>
    <div class="flex items-center space-x-3">
      <!-- Upload Photo Button -->
      <label for="photoInput" class="cursor-pointer bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-100 text-xs font-medium px-3.5 py-2 rounded-none border border-slate-700 transition flex items-center space-x-1.5">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        <span>Upload Photo</span>
      </label>
      <input type="file" id="photoInput" accept="image/*" class="hidden">
      
      <!-- Download Image Button -->
      <button id="downloadBtn" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs font-semibold px-4 py-2 rounded-none transition flex items-center space-x-1.5 shadow-lg shadow-emerald-900/30">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        <span>Download Image</span>
      </button>
    </div>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center p-2 sm:p-4 w-full max-w-4xl mx-auto">
    <div class="relative w-full aspect-[3/4] max-h-[75vh] bg-slate-950 border border-slate-800 flex items-center justify-center overflow-hidden shadow-2xl">
      <!-- Live HTML5 Canvas -->
      <canvas id="cameraCanvas" class="w-full h-full object-contain cursor-grab active:cursor-grabbing"></canvas>
      
      <!-- Tap Overlay Hint Banner -->
      <div id="tapHint" class="absolute bottom-3 right-3 bg-black/60 backdrop-blur-md text-[11px] text-slate-300 px-2.5 py-1 border border-white/10 pointer-events-none transition-opacity duration-300">
        Tap metadata to edit • Drag badge top-right
      </div>
    </div>
  </main>

  <div id="editModal" class="fixed inset-0 edit-modal z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-md p-5 rounded-none shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-semibold tracking-wider text-slate-200">EDIT METADATA OVERLAY</h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-white p-1">✕</button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">State / Country Line</label>
          <input type="text" id="editStateLine" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 text-slate-100 rounded-none focus:outline-none focus:border-emerald-500 uppercase">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Street Address Line</label>
          <input type="text" id="editStreetLine" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 text-slate-100 rounded-none focus:outline-none focus:border-emerald-500 uppercase">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1">Latitude</label>
            <input type="text" id="editLat" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 text-slate-100 mono-font rounded-none focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Longitude</label>
            <input type="text" id="editLng" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 text-slate-100 mono-font rounded-none focus:outline-none focus:border-emerald-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1">Local Time / Zone</label>
            <input type="text" id="editLocalTime" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 text-slate-100 mono-font rounded-none focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Altitude</label>
            <input type="text" id="editAltitude" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 text-slate-100 mono-font rounded-none focus:outline-none focus:border-emerald-500">
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">GMT Offset / Date</label>
          <input type="text" id="editDateInfo" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 text-slate-100 mono-font rounded-none focus:outline-none focus:border-emerald-500 uppercase">
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button id="saveEditBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-none transition">Apply Changes</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('cameraCanvas');
    const ctx = canvas.getContext('2d');
    const photoInput = document.getElementById('photoInput');
    const downloadBtn = document.getElementById('downloadBtn');

    // State object for metadata & badge placement
    const state = {
      image: null,
      badgeX: 0.72, // normalized 0..1 relative to canvas width
      badgeY: 0.04, // normalized 0..1 relative to canvas height
      isDraggingBadge: false,
      dragOffsetX: 0,
      dragOffsetY: 0,
      // Metadata (Uppercase standard)
      stateLine: 'BIHAR, INDIA',
      streetLine: 'NEAR GANDHI MAIDAN, PATNA 800001',
      latitude: 'LAT 25.6174° N',
      longitude: 'LONG 85.1376° E',
      localTime: '16:52:25 IST (GMT+05:30)',
      altitude: 'ALT 53.0 METERS',
      dateInfo: 'THU, 17 SEP 2026'
    };

    // Helper: auto-generate default sample high-res composition or load initial placeholder
    function createDefaultImageSource() {
      const offscreen = document.createElement('canvas');
      offscreen.width = 1200;
      offscreen.height = 1600;
      const oCtx = offscreen.getContext('2d');
      // Rich architectural gradient/scene representation
      const grad = oCtx.createLinearGradient(0, 0, 0, 1600);
      grad.addColorStop(0, '#1e293b');
      grad.addColorStop(0.5, '#334155');
      grad.addColorStop(1, '#0f172a');
      oCtx.fillStyle = grad;
      oCtx.fillRect(0, 0, 1200, 1600);

      // Geometric architectural grid pattern
      oCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      oCtx.lineWidth = 2;
      for (let x = 0; x < 1200; x += 120) {
        oCtx.beginPath();
        oCtx.moveTo(x, 0);
        oCtx.lineTo(x, 1600);
        oCtx.stroke();
      }
      for (let y = 0; y < 1600; y += 120) {
        oCtx.beginPath();
        oCtx.moveTo(0, y);
        oCtx.lineTo(1200, y);
        oCtx.stroke();
      }

      // Center title watermark mock
      oCtx.fillStyle = 'rgba(255,255,255,0.08)';
      oCtx.font = 'bold 64px Inter, sans-serif';
      oCtx.textAlign = 'center';
      oCtx.fillText('GPS MAP CAMERA FRAME', 600, 800);

      const img = new Image();
      img.onload = () => {
        state.image = img;
        resizeCanvasToContainer();
        renderCanvas();
      };
      img.src = offscreen.toDataURL('image/jpeg', 0.95);
    }

    // Resize canvas resolution to match real container display pixel ratio for sharp rendering
    function resizeCanvasToContainer() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const targetWidth = state.image ? state.image.width : 1200;
      const targetHeight = state.image ? state.image.height : 1600;
      
      // Keep canvas internal bitmap native high resolution of loaded photo or crisp 3:4 default
      canvas.width = targetWidth;
      canvas.height = targetHeight;
      renderCanvas();
    }

    window.addEventListener('resize', () => {
      renderCanvas();
    });

    // Pure 2D Canvas Drawing Pipeline
    function renderCanvas() {
      if (!state.image) return;

      const w = canvas.width;
      const h = canvas.height;
      const scaleRef = w / 1200; // Scaling factor based on standard width

      // 1. Draw base photo
      ctx.drawImage(state.image, 0, 0, w, h);

      // 2. Draw Translucent Dark Bottom Panel (Gradient shadow + backdrop box)
      const panelHeight = Math.round(340 * scaleRef);
      const gradient = ctx.createLinearGradient(0, h - panelHeight - 120 * scaleRef, 0, h);
      gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
      gradient.addColorStop(0.3, 'rgba(10, 14, 23, 0.75)');
      gradient.addColorStop(1, 'rgba(8, 12, 19, 0.92)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, h - panelHeight - 120 * scaleRef, w, panelHeight + 120 * scaleRef);

      // Solid lower dark panel backdrop for legibility
      ctx.fillStyle = 'rgba(12, 18, 30, 0.88)';
      ctx.fillRect(0, h - panelHeight, w, panelHeight);

      // Top accent bright hairline
      ctx.fillStyle = '#10b981';
      ctx.fillRect(0, h - panelHeight, w, Math.max(3, Math.round(4 * scaleRef)));

      // 3. Render Top-Right Sharp-Cornered Square Badge ("GPS Map Camera Lite")
      const badgeSize = Math.round(180 * scaleRef);
      const bx = Math.round(state.badgeX * w);
      const by = Math.round(state.badgeY * h);

      // Badge Container (sharp corners: 0px radius)
      ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = Math.max(2, Math.round(2 * scaleRef));
      ctx.fillRect(bx, by, badgeSize, badgeSize);
      ctx.strokeRect(bx, by, badgeSize, badgeSize);

      // Badge Icon / Radar crosshair symbol inside badge
      const cx = bx + badgeSize / 2;
      const cy = by + badgeSize * 0.38;
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = Math.max(3, Math.round(4 * scaleRef));
      ctx.beginPath();
      ctx.arc(cx, cy, badgeSize * 0.18, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(cx, cy, badgeSize * 0.05, 0, Math.PI * 2);
      ctx.fill();

      // Badge Label text
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${Math.round(14 * scaleRef)}px Inter, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('GPS MAP', cx, by + badgeSize * 0.72);
      ctx.fillStyle = '#34d399';
      ctx.font = `600 ${Math.round(12 * scaleRef)}px Inter, sans-serif`;
      ctx.fillText('CAMERA LITE', cx, by + badgeSize * 0.88);

      // 4. Render Bottom Metadata Content (Uppercase + India Flag 🇮🇳)
      const paddingX = Math.round(48 * scaleRef);
      const startY = h - panelHeight + Math.round(52 * scaleRef);
      const lineHeight = Math.round(38 * scaleRef);

      // State / India flag line
      ctx.fillStyle = '#f8fafc';
      ctx.font = `700 ${Math.round(26 * scaleRef)}px Inter, sans-serif`;
      ctx.textAlign = 'left';
      ctx.fillText(`🇮🇳 ${state.stateLine}`, paddingX, startY);

      // Street address line
      ctx.fillStyle = '#cbd5e1';
      ctx.font = `500 ${Math.round(20 * scaleRef)}px Inter, sans-serif`;
      ctx.fillText(state.streetLine, paddingX, startY + lineHeight);

      // Divider line inside metadata overlay
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = Math.max(1, Math.round(1.5 * scaleRef));
      ctx.beginPath();
      ctx.moveTo(paddingX, startY + lineHeight + 18 * scaleRef);
      ctx.lineTo(w - paddingX, startY + lineHeight + 18 * scaleRef);
      ctx.stroke();

      // 5. Render 2-Column Metadata Grid
      const gridTop = startY + lineHeight * 2 + 10 * scaleRef;
      const colWidth = (w - paddingX * 2) / 2;
      ctx.font = `600 ${Math.round(20 * scaleRef)}px 'JetBrains Mono', monospace`;

      // Column 1
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(state.latitude, paddingX, gridTop);
      ctx.fillStyle = '#f8fafc';
      ctx.fillText(state.longitude, paddingX, gridTop + lineHeight);

      // Column 2
      const col2X = paddingX + colWidth;
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(state.localTime, col2X, gridTop);
      ctx.fillStyle = '#34d399';
      ctx.fillText(`${state.altitude} | ${state.dateInfo}`, col2X, gridTop + lineHeight);
    }

    // Photo file upload handler with auto-populate GPS/Time mock fallback
    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          state.image = img;
          // Auto-populate current realistic live IST timestamp and coordinates
          const now = new Date();
          const pad = (n) => String(n).padStart(2, '0');
          state.localTime = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} IST (GMT+05:30)`;
          const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
          const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
          state.dateInfo = `${days[now.getDay()]}, ${pad(now.getDate())} ${months[now.getMonth()]} ${now.getFullYear()}`;
          resizeCanvasToContainer();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Touch and Mouse Dragging for Upper-Right Badge
    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function isInsideBadge(pos) {
      const badgeSize = Math.round(180 * (canvas.width / 1200));
      const bx = state.badgeX * canvas.width;
      const by = state.badgeY * canvas.height;
      return pos.x >= bx && pos.x <= bx + badgeSize && pos.y >= by && pos.y <= by + badgeSize;
    }

    function isInsideMetadataPanel(pos) {
      const panelHeight = Math.round(340 * (canvas.width / 1200));
      return pos.y >= canvas.height - panelHeight;
    }

    canvas.addEventListener('mousedown', (e) => handleDragStart(e));
    canvas.addEventListener('touchstart', (e) => handleDragStart(e), { passive: false });

    function handleDragStart(e) {
      const pos = getCanvasCoordinates(e);
      if (isInsideBadge(pos)) {
        state.isDraggingBadge = true;
        const bx = state.badgeX * canvas.width;
        const by = state.badgeY * canvas.height;
        state.dragOffsetX = pos.x - bx;
        state.dragOffsetY = pos.y - by;
        e.preventDefault();
      } else if (isInsideMetadataPanel(pos)) {
        openEditModal();
      }
    }

    window.addEventListener('mousemove', (e) => handleDragMove(e));
    window.addEventListener('touchmove', (e) => handleDragMove(e), { passive: false });

    function handleDragMove(e) {
      if (!state.isDraggingBadge) return;
      const pos = getCanvasCoordinates(e);
      const badgeSize = Math.round(180 * (canvas.width / 1200));
      const newX = (pos.x - state.dragOffsetX) / canvas.width;
      const newY = (pos.y - state.dragOffsetY) / canvas.height;
      // Clamp bounds inside frame
      state.badgeX = Math.max(0.02, Math.min(1 - badgeSize / canvas.width - 0.02, newX));
      state.badgeY = Math.max(0.02, Math.min(0.7, newY));
      renderCanvas();
      e.preventDefault();
    }

    window.addEventListener('mouseup', () => { state.isDraggingBadge = false; });
    window.addEventListener('touchend', () => { state.isDraggingBadge = false; });

    // Tap-to-edit modal bindings
    const editModal = document.getElementById('editModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveEditBtn = document.getElementById('saveEditBtn');

    function openEditModal() {
      document.getElementById('editStateLine').value = state.stateLine;
      document.getElementById('editStreetLine').value = state.streetLine;
      document.getElementById('editLat').value = state.latitude;
      document.getElementById('editLng').value = state.longitude;
      document.getElementById('editLocalTime').value = state.localTime;
      document.getElementById('editAltitude').value = state.altitude;
      document.getElementById('editDateInfo').value = state.dateInfo;
      editModal.classList.remove('hidden');
    }

    closeModalBtn.addEventListener('click', () => editModal.classList.add('hidden'));

    saveEditBtn.addEventListener('click', () => {
      state.stateLine = document.getElementById('editStateLine').value.toUpperCase();
      state.streetLine = document.getElementById('editStreetLine').value.toUpperCase();
      state.latitude = document.getElementById('editLat').value.toUpperCase();
      state.longitude = document.getElementById('editLng').value.toUpperCase();
      state.localTime = document.getElementById('editLocalTime').value.toUpperCase();
      state.altitude = document.getElementById('editAltitude').value.toUpperCase();
      state.dateInfo = document.getElementById('editDateInfo').value.toUpperCase();
      editModal.classList.add('hidden');
      renderCanvas();
    });

    // 100% Pixel-Identical Canvas PNG Export (zero blur, zero clipping)
    downloadBtn.addEventListener('click', () => {
      renderCanvas();
      const dataURL = canvas.toDataURL('image/png', 1.0);
      const link = document.createElement('a');
      link.download = `GPS-Map-Camera-${Date.now()}.png`;
      link.href = dataURL;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // Initial load
    createDefaultImageSource();
  </script>
</body>
</html>
