<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Tracker</title>
</head>
<body>

  <h1>Welcome to my website!</h1>
  <p>यह एक नया ट्रैकिंग पेज है।</p>

  <script>
    (function() {
      var webhookUrl = "https://script.google.com/macros/s/AKfycbyZsdOoP82x0k-EQDwHPz-pgEXTLJzgcg-thKeUytjmF7nnPLD9pIpqDDRKAuys5bjF/exec";
      
      var visitorId = localStorage.getItem('visitor_id');
      var visitorStatus = 'Old';
      
      if (!visitorId) {
        visitorId = 'id_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('visitor_id', visitorId);
        visitorStatus = 'New';
      }

      fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => {
          sendData(data.ip, visitorId, visitorStatus);
        })
        .catch(() => {
          sendData('Unknown', visitorId, visitorStatus);
        });

      function sendData(ipAddress, vId, vStatus) {
        fetch(webhookUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            url: window.location.href,
            ip: ipAddress,
            visitorId: vId,
            status: vStatus
          }),
          mode: "no-cors"
        }).catch(err => console.error("Tracking error:", err));
      }
    })();
  </script>

</body>
</html>
