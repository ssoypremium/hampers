<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सहज रेडियो</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 15px; 
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%); 
            min-height: 100vh; 
            margin: 0; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #fff;
        }
        .main-container {
            margin: auto;
            width: 100%;
        }
        .player-card { 
            width: 100%;
            max-width: 450px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            color: #2d3748;
        }
        h1 { 
            color: #134e5e; 
            margin-bottom: 10px; 
            font-size: 24px; 
        }
        audio { 
            width: 100%; 
            margin-top: 15px; 
            outline: none; 
        }
        .date-display { 
            color: #718096; 
            font-size: 14px; 
            margin-bottom: 10px; 
        }
        .track-title { 
            font-size: 15px; 
            color: #4a5568; 
            margin-top: 10px; 
            font-weight: bold; 
        }
        
        /* Footer Advertisement Marquee Style */
        footer {
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 5px;
            width: 100%;
            border-radius: 8px;
            margin-top: 20px;
        }
        marquee {
            font-size: 16px;
            color: #ffeb3b;
            font-weight: bold;
        }

        /* Mobile Specific Adjustments */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .player-card {
                padding: 15px;
            }
            h1 {
                font-size: 20px;
            }
            marquee {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="player-card">
        <h1>सहज रेडियो</h1>
        <div class="date-display" id="dateDisplay"></div>
        <div class="track-title" id="trackTitle">लोड हो रहा है...</div>
        <audio id="audioPlayer" controls autoplay>
            Aapka browser audio support nahi karta.
        </audio>
    </div>
</div>

<!-- Footer with Ad Marquee -->
<footer>
    <marquee id="adMarquee" behavior="scroll" direction="left">
        सहज रेडियो में आपका स्वागत है! | यहाँ ध्यान और शांति से जुड़ी बातें सुनें।
    </marquee>
</footer>

<script>
    const speeches = [
        { name: "आत्मशतकम् - भाग 1", url: "https://raw.githubusercontent.com/ssoypremium/hampers/main/radio/Atmashatakam.mp3" },
        { name: "आत्मशतकम् - भाग 2", url: "https://raw.githubusercontent.com/ssoypremium/hampers/main/radio/Atmashatakam.mp3" },
        { name: "आत्मशतकम् - भाग 3", url: "https://raw.githubusercontent.com/ssoypremium/hampers/main/radio/Atmashatakam.mp3" }
    ];

    let currentIndex = 0;
    const player = document.getElementById('audioPlayer');
    const trackTitleElem = document.getElementById('trackTitle');

    const today = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('dateDisplay').innerText = today.toLocaleDateString('hi-IN', options);

    function playTrack(index) {
        if (index >= speeches.length) {
            currentIndex = 0;
        }
        player.src = speeches[currentIndex].url;
        trackTitleElem.innerText = speeches[currentIndex].name;
        player.play().catch(e => console.log("Auto-play blocked, user interaction needed"));
    }

    player.addEventListener('ended', function() {
        currentIndex++;
        playTrack(currentIndex);
    });

    playTrack(currentIndex);
</script>

</body>
</html>
