<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visitor Tracking Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .box {
      width: 90%;
      max-width: 500px;
      padding: 35px 25px;
      background: white;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h1 {
      margin: 0 0 10px;
    }

    p {
      color: #666;
      margin: 0;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Welcome</h1>
    <p>Visitor Tracking Test Website</p>
  </div>


  <!-- ============================= -->
  <!-- VISITOR TRACKING SYSTEM -->
  <!-- ============================= -->

  <script>

    (function () {

      const TRACKING_URL =
        "https://script.google.com/macros/s/AKfycbxeoEo6gaWZYdBcuGXm9yDc3aGzeMvBVi8_9MqF67iSNcuPLbO07JpsedrZAlzAsRfbfQ/exec";


      // Get existing Visitor ID
      let visitorId = localStorage.getItem("visitor_id");


      // If visitor is new, create a new ID
      if (!visitorId) {

        visitorId =
          "V-" +
          Date.now() +
          "-" +
          Math.random().toString(36).substring(2, 10);

        localStorage.setItem("visitor_id", visitorId);
      }


      // Get current page
      const page =
        window.location.pathname || "/";


      // Send information to Google Sheet
      const trackingImage = new Image();

      trackingImage.src =
        TRACKING_URL +
        "?visitor=" +
        encodeURIComponent(visitorId) +
        "&page=" +
        encodeURIComponent(page);


    })();

  </script>

</body>
</html>
