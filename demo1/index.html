<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visitor Tracking Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 10px;
    }

    p {
      color: #666;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Welcome</h1>
    <p>This is a visitor tracking test page.</p>
  </div>


  <script>

    // ==========================================
    // GOOGLE APPS SCRIPT URL
    // ==========================================

    const TRACKING_URL =
      "https://script.google.com/macros/s/AKfycbxeoEo6gaWZYdBcuGXm9yDc3aGzeMvBVi8_9MqF67iSNcuPLbO07JpsedrZAlzAsRfbfQ/exec";


    // ==========================================
    // CREATE / GET VISITOR ID
    // ==========================================

    let visitorId = localStorage.getItem("my_visitor_id");

    if (!visitorId) {

      visitorId =
        "V-" +
        Date.now().toString(36) +
        "-" +
        Math.random().toString(36).substring(2, 10);

      localStorage.setItem("my_visitor_id", visitorId);
    }


    // ==========================================
    // CURRENT PAGE
    // ==========================================

    const currentPage =
      window.location.pathname || "/";


    // ==========================================
    // SEND VISITOR DATA
    // ==========================================

    const trackingRequest =
      TRACKING_URL +
      "?visitorId=" +
      encodeURIComponent(visitorId) +
      "&page=" +
      encodeURIComponent(currentPage);


    // ==========================================
    // SEND IN BACKGROUND
    // ==========================================

    fetch(trackingRequest, {
      method: "GET",
      mode: "no-cors",
      keepalive: true
    }).catch(function(error) {

      console.log("Visitor tracking error:", error);

    });

  </script>

</body>
</html>
