<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visitor Tracking Test</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f3f3f3;
        }

        .box {
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
            background: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        h1 {
            margin: 0 0 10px;
        }

        p {
            margin: 0;
            color: #666;
        }

    </style>

</head>


<body>


    <div class="box">

        <h1>Welcome</h1>

        <p>Visitor Tracking Test</p>

    </div>



    <!-- =====================================
         AUTOMATIC VISITOR TRACKING
         ===================================== -->

    <script>

        (function () {

            // YOUR GOOGLE APPS SCRIPT WEB APP
            const GOOGLE_SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbyF-OlPNlRvjZilDDoNy8e9NoIHUm1W3gF0TDsosYah0D3GZgaJNVAMPmOTTF3ybEnc/exec";


            // ---------------------------------
            // GET EXISTING VISITOR ID
            // ---------------------------------

            let visitorId =
                localStorage.getItem("visitor_id");


            // ---------------------------------
            // CREATE NEW VISITOR ID
            // ---------------------------------

            if (!visitorId) {

                visitorId =
                    "V-" +
                    Date.now() +
                    "-" +
                    Math.random()
                    .toString(36)
                    .substring(2, 10);

                localStorage.setItem(
                    "visitor_id",
                    visitorId
                );

            }


            // ---------------------------------
            // GET CURRENT PAGE
            // ---------------------------------

            let currentPage =
                window.location.pathname;

            if (!currentPage) {
                currentPage = "/";
            }


            // ---------------------------------
            // CREATE TRACKING URL
            // ---------------------------------

            const trackingURL =
                GOOGLE_SCRIPT_URL +
                "?visitor=" +
                encodeURIComponent(visitorId) +
                "&page=" +
                encodeURIComponent(currentPage);


            // ---------------------------------
            // SEND TO GOOGLE SHEET
            // ---------------------------------

            const tracker =
                new Image();

            tracker.src =
                trackingURL;


        })();

    </script>


</body>
</html>
