<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Tracker Page</title>
</head>
<body>

  <h1>Welcome to my website!</h1>
  <p>यह एक सैंपल पेज है।</p>

  <script>
    (function() {
      var webhookUrl = "https://script.google.com/macros/s/AKfycbwlmtGDFE8J_A-u1pf2fHXFlWDOy4nIh7zOwxbLuCAFc5RnkRGOMci588dE--j9Y687jg/exec";
      
      // IP पता लेने के लिए फ्री सर्विस
      fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => {
          sendData(data.ip);
        })
        .catch(() => {
          sendData('Unknown');
        });

      function sendData(ipAddress) {
        fetch(webhookUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            url: window.location.href,
            ip: ipAddress
          }),
          mode: "no-cors"
        }).catch(err => console.error("Tracking error:", err));
      }
    })();
  </script>

</body>
</html>
