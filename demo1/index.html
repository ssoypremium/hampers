<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visitor Tracking Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .box {
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
            background: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin: 0 0 12px;
        }

        p {
            margin: 0;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Welcome</h1>
        <p>Visitor Tracking Test</p>
    </div>


    <script>

        // Google Apps Script Web App
        const GOOGLE_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbxeoEo6gaWZYdBcuGXm9yDc3aGzeMvBVi8_9MqF67iSNcuPLbO07JpsedrZAlzAsRfbfQ/exec";


        // Test visitor information
        const visitor = "WEBSITE_TEST";


        // Test page
        const page = "/";


        // Create request URL
        const testURL =
            GOOGLE_SCRIPT_URL +
            "?visitor=" +
            encodeURIComponent(visitor) +
            "&page=" +
            encodeURIComponent(page);


        // Send request
        window.location.href = testURL;

    </script>

</body>
</html>
