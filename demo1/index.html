<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visitor Tracking Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 10px;
    }

    p {
      color: #666;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Welcome</h1>
    <p>This is a visitor tracking test page.</p>
  </div>


  <script>
(function () {

  const TRACKING_URL =
    "https://script.google.com/macros/s/AKfycbxeoEo6gaWZYdBcuGXm9yDc3aGzeMvBVi8_9MqF67iSNcuPLbO07JpsedrZAlzAsRfbfQ/exec";

  let visitorId = localStorage.getItem("visitor_id");

  if (!visitorId) {
    visitorId =
      "V-" +
      Date.now().toString(36) +
      "-" +
      Math.random().toString(36).substring(2, 10);

    localStorage.setItem("visitor_id", visitorId);
  }

  const page = window.location.pathname;

  fetch(
    TRACKING_URL +
    "?visitor=" + encodeURIComponent(visitorId) +
    "&page=" + encodeURIComponent(page),
    {
      method: "GET",
      mode: "no-cors",
      keepalive: true
    }
  ).catch(function () {});

})();
</script>

</body>
</html>
