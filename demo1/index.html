<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visitor Tracking Test</title>

</head>

<body>

    <h1>My Website</h1>

    <p>Welcome to my website.</p>


    <script>

        // ==============================
        // GOOGLE APPS SCRIPT URL
        // ==============================

        const TRACKING_URL =
        "https://script.google.com/macros/s/AKfycbzj5AiERlf6KCPT9kthLdWUjpSLBbG1A7-jFx9qTIT58AL9388ND0iduW0Rdy9XFF4/exec";


        // ==============================
        // GET VISITOR ID
        // ==============================

        let visitorId =
            localStorage.getItem("visitor_id");


        // ==============================
        // CREATE ID FOR NEW VISITOR
        // ==============================

        if (!visitorId) {

            visitorId =
                "V-" +
                Date.now() +
                "-" +
                Math.random()
                .toString(36)
                .substring(2, 10);

            localStorage.setItem(
                "visitor_id",
                visitorId
            );
        }


        // ==============================
        // GET CURRENT PAGE
        // ==============================

        const page =
            window.location.pathname || "/";


        // ==============================
        // SEND DATA TO GOOGLE SHEET
        // ==============================

        const img = new Image();

        img.src =
            TRACKING_URL +
            "?visitor=" +
            encodeURIComponent(visitorId) +
            "&page=" +
            encodeURIComponent(page);

    </script>

</body>
</html>
