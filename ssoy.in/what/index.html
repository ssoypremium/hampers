<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #38bdf8;
        }
        p {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🛠️</div>
        <h1>We'll be back soon!</h1>
        <p>Our website is currently undergoing scheduled maintenance. We are working hard to bring you an improved experience. Thank you for your patience!</p>
    </div>
    <script>
(function () {
  const API = "https://script.google.com/macros/s/AKfycbxeoEo6gaWZYdBcuGXm9yDc3aGzeMvBVi8_9MqF67iSNcuPLbO07JpsedrZAlzAsRfbfQ/exec";

  let visitorId = localStorage.getItem("visitor_id");

  if (!visitorId) {
    visitorId = "V-" + crypto.randomUUID();
    localStorage.setItem("visitor_id", visitorId);
  }

  const url =
    API +
    "?visitorId=" + encodeURIComponent(visitorId) +
    "&page=" + encodeURIComponent(location.pathname);

  fetch(url, {
    method: "GET",
    mode: "no-cors",
    keepalive: true
  }).catch(() => {});
})();
</script>

          <script>
        // Disable Right Click
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // Disable F12, Ctrl+U, Ctrl+Shift+I, Ctrl+Shift+J
        document.onkeydown = function (e) {
            if (e.keyCode == 123) return false; // F12
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
        };
    </script>
    <script>
        (function() {
          var webhookUrl = "https://script.google.com/macros/s/AKfycbwUq0CnxjhULKOAY8R0WwHphVhNLscyOlAFN10rBImlUrDEF7E18f2cTkooN7l1jLFU/exec";
        
          
          fetch(webhookUrl)
            .then(response => response.text())
            .then(count => {
              document.getElementById('visitor-count').innerText = count;
            })
            .catch(err => {
              document.getElementById('visitor-count').innerText = '0';
            });
        
          var visitorId = localStorage.getItem('visitor_id');
          var visitorStatus = 'Old';
        
          if (!visitorId) {
            visitorId = 'id_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('visitor_id', visitorId);
            visitorStatus = 'New';
          }
      
          fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
              sendData(data.ip, visitorId, visitorStatus);
            })
            .catch(() => {
              sendData('Unknown', visitorId, visitorStatus);
            });
        
          function sendData(ipAddress, vId, vStatus) {
            fetch(webhookUrl, {
              method: "POST",
              headers: {
                "Content-Type": "text/plain;charset=utf-8"
              },
              body: JSON.stringify({
                url: window.location.href,
                ip: ipAddress,
                visitorId: vId,
                status: vStatus
              })
            }).catch(err => console.error("Tracking error:", err));
          }
        })();
    </script>

</body>
</html>
