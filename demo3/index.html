<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Tracker</title>
  <style>
    .visitor-footer {
      margin-top: 50px;
      padding: 15px;
      border-top: 1px solid #ccc;
      background-color: #f9f9f9;
      font-family: sans-serif;
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>Welcome to my website!</h1>
  <p>यह एक नया ट्रैकिंग पेज है।</p>

  <!-- सबसे नीचे वाला विजिटर सेक्शन -->
  <div class="visitor-footer">
    <h3>Visitor Stats</h3>
    <p>Total Visitors: <strong id="visitor-count">Loading...</strong></p>
  </div>

  <script>
    (function() {
      var webhookUrl = "https://script.google.com/macros/s/AKfycbyZsdOoP82x0k-EQDwHPz-pgEXTLJzgcg-thKeUytjmF7nnPLD9pIpqDDRKAuys5bjF/exec";
      
      // कुल विजिटर काउंट फैच करना (GET रिक्वेस्ट)
      fetch(webhookUrl)
        .then(response => response.text())
        .then(count => {
          document.getElementById('visitor-count').innerText = count;
        })
        .catch(err => {
          document.getElementById('visitor-count').innerText = 'N/A';
        });

      var visitorId = localStorage.getItem('visitor_id');
      var visitorStatus = 'Old';
      
      if (!visitorId) {
        visitorId = 'id_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('visitor_id', visitorId);
        visitorStatus = 'New';
      }

      fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => {
          sendData(data.ip, visitorId, visitorStatus);
        })
        .catch(() => {
          sendData('Unknown', visitorId, visitorStatus);
        });

      function sendData(ipAddress, vId, vStatus) {
        fetch(webhookUrl, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8" // CORS issue से बचने के लिए text/plain या no-cors
          },
          body: JSON.stringify({
            url: window.location.href,
            ip: ipAddress,
            visitorId: vId,
            status: vStatus
          })
          // mode: "no-cors" हटा दिया गया है ताकि POST प्रॉपर्ली JSON पार्स कर सके (यदि Apps Script CORS ब्लॉक करे तो इसे दोबारा text/plain कर सकते हैं)
        }).catch(err => console.error("Tracking error:", err));
      }
    })();
  </script>

</body>
</html>
