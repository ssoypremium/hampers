<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>voip phone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .pulse-ring {
      animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-4 text-white min-h-screen">

  <div class="w-full max-w-md glass rounded-3xl p-6 shadow-2xl flex flex-col justify-between min-h-[620px] relative overflow-hidden">
    
    <!-- Top Header -->
    <div class="flex items-center justify-between border-b border-slate-700/50 pb-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-blue-600/30 border border-blue-400/30 flex items-center justify-center text-blue-400 font-bold text-lg">
          O2
        </div>
        <div>
          <h1 class="font-semibold text-lg text-slate-100">Oxigen</h1>
          <p class="text-xs text-slate-400">Outgoing Terminal</p>
        </div>
      </div>
      <div id="statusBadge" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700">
        Idle
      </div>
    </div>

    <!-- Main Dynamic Call Area -->
    <div class="my-auto flex flex-col items-center justify-center text-center space-y-6 py-6">
      
      <!-- Avatar & Ripple Effect -->
      <div class="relative">
        <div id="avatarRing" class="w-28 h-28 rounded-full bg-slate-800/80 border-2 border-slate-600 flex items-center justify-center transition-all duration-300">
          <i id="avatarIcon" class="fa-solid fa-mobile-screen-button text-4xl text-slate-400"></i>
        </div>
      </div>

      <!-- Caller Info & Timer -->
      <div>
        <h2 id="callStateTitle" class="text-xl font-medium text-slate-200">Ready</h2>
        <p id="callTimer" class="text-3xl font-mono font-bold text-blue-400 mt-1 hidden">00:00</p>
        <p id="statusSubtext" class="text-xs text-slate-400 mt-2 max-w-[240px]">End to End voip conversation.</p>
      </div>

      <!-- Realtime Audio Visualizer Meters -->
      <div id="audioVisualizers" class="w-full space-y-3 pt-2 opacity-50 transition-opacity">
        <div>
          <div class="flex justify-between text-[10px] text-slate-400 mb-1 font-medium">
            <span><i class="fa-solid fa-microphone mr-1"></i>Local</span>
            <span id="localVolText">0%</span>
          </div>
          <div class="w-full bg-slate-800/80 rounded-full h-2 overflow-hidden border border-slate-700/50">
            <div id="localMeter" class="bg-blue-500 h-full w-0% transition-all duration-75 rounded-full"></div>
          </div>
        </div>

        <div>
          <div class="flex justify-between text-[10px] text-slate-400 mb-1 font-medium">
            <span><i class="fa-solid fa-volume-high mr-1"></i>voip</span>
            <span id="remoteVolText">0%</span>
          </div>
          <div class="w-full bg-slate-800/80 rounded-full h-2 overflow-hidden border border-slate-700/50">
            <div id="remoteMeter" class="bg-emerald-500 h-full w-0% transition-all duration-75 rounded-full"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Controls Bottom Bar -->
    <div class="space-y-3 pt-4 border-t border-slate-700/50">
      
      <!-- Primary Action Buttons -->
      <div id="idleControls" class="flex gap-3">
        <button id="callBtn" onclick="startCall()" class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-medium rounded-xl shadow-lg shadow-blue-600/30 flex items-center justify-center space-x-2 transition">
          <i class="fa-solid fa-phone"></i>
          <span>Call</span>
        </button>
      </div>

      <div id="activeControls" class="hidden flex items-center justify-center space-x-4">
        <!-- Mute Button -->
        <button id="muteBtn" onclick="toggleMute()" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 flex items-center justify-center text-lg transition active:scale-90">
          <i id="muteIcon" class="fa-solid fa-microphone"></i>
        </button>

        <!-- Hangup Button -->
        <button id="hangupBtn" onclick="endCall(true)" class="py-3.5 px-6 bg-red-600 hover:bg-red-500 active:scale-95 text-white font-medium rounded-xl shadow-lg shadow-red-600/30 flex items-center justify-center space-x-2 transition">
          <i class="fa-solid fa-phone-slash"></i>
          <span>Cut / End Call</span>
        </button>
      </div>

    </div>

  </div>

  <!-- Hidden Remote Audio Player -->
  <audio id="remoteAudio" autoplay></audio>

  <!-- Firebase & WebRTC Script Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove, push, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://voip-e867a-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Call state variables
    let localStream = null;
    let peerConnection = null;
    let isMuted = false;
    let timerInterval = null;
    let secondsElapsed = 0;
    let localAudioContext = null;
    let remoteAudioContext = null;
    let callSessionRef = ref(db, 'calls/active_call');
    let candidatesRef = ref(db, 'calls/active_call/callerCandidates');
    let isInitiator = false;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19020' },
        { urls: 'stun:stun1.l.google.com:19020' }
      ]
    };

    // UI elements
    const statusBadge = document.getElementById('statusBadge');
    const callStateTitle = document.getElementById('callStateTitle');
    const statusSubtext = document.getElementById('statusSubtext');
    const callTimer = document.getElementById('callTimer');
    const avatarRing = document.getElementById('avatarRing');
    const avatarIcon = document.getElementById('avatarIcon');
    const idleControls = document.getElementById('idleControls');
    const activeControls = document.getElementById('activeControls');
    const audioVisualizers = document.getElementById('audioVisualizers');
    const muteBtn = document.getElementById('muteBtn');
    const muteIcon = document.getElementById('muteIcon');

    // Attach globals for inline onclick
    window.startCall = startCall;
    window.endCall = endCall;
    window.toggleMute = toggleMute;

    // Listen to Firebase call status changes
    onValue(callSessionRef, (snapshot) => {
      const data = snapshot.val();

      if (!data) {
        if (isInitiator) {
          resetCallUI("Call Ended");
        }
        return;
      }

      // If receiver rejected or ended call
      if (data.status === 'ended') {
        resetCallUI("Call Ended by Phone 2");
        setTimeout(() => remove(callSessionRef), 1000);
      } else if (data.status === 'rejected') {
        resetCallUI("Phone 2 Rejected Call");
        setTimeout(() => remove(callSessionRef), 1000);
      } else if (data.status === 'busy') {
        resetCallUI("Phone 2 is Busy");
      } else if (data.status === 'connected' && peerConnection) {
        updateStatusUI('connected', 'Connected with Phone 2', 'Talking now...');
        startTimer();
      }

      // Handle answer from receiver
      if (data.answer && peerConnection && peerConnection.signalingState === 'have-local-offer') {
        peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      }
    });

    // Listen for ICE candidates from Receiver
    const receiverCandidatesRef = ref(db, 'calls/active_call/receiverCandidates');
    onValue(receiverCandidatesRef, (snapshot) => {
      snapshot.forEach((child) => {
        const candidate = child.val();
        if (peerConnection && candidate) {
          peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => console.error(e));
        }
      });
    });

    async function startCall() {
      try {
        // Pre-check if call session already exists in DB
        const response = await fetch('https://voip-e867a-default-rtdb.firebaseio.com/calls/active_call.json');
        const existingData = await response.json();

        if (existingData && (existingData.status === 'ringing' || existingData.status === 'connected')) {
          alert('Phone 2 or Call line is already busy!');
          updateStatusUI('busy', 'Line Busy', 'Another call is currently active.');
          return;
        }

        isInitiator = true;
        updateStatusUI('calling', 'Calling Phone 2...', 'Waiting for Phone 2 to answer...');
        
        // Request Microphone access
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        setupAudioVisualizer(localStream, 'localMeter', 'localVolText', true);

        // Setup PeerConnection
        peerConnection = new RTCPeerConnection(rtcConfig);

        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        // Collect local ICE candidates
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            push(candidatesRef, event.candidate.toJSON());
          }
        };

        // Handle remote stream
        peerConnection.ontrack = (event) => {
          const remoteAudio = document.getElementById('remoteAudio');
          remoteAudio.srcObject = event.streams[0];
          setupAudioVisualizer(event.streams[0], 'remoteMeter', 'remoteVolText', false);
        };

        // Create Offer
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        // Publish session to Firebase
        await set(callSessionRef, {
          offer: {
            type: offer.type,
            sdp: offer.sdp
          },
          status: 'ringing',
          caller: 'Phone 1',
          createdAt: Date.now()
        });

        // Clean DB if tab closes
        onDisconnect(callSessionRef).remove();

      } catch (err) {
        console.error("Error starting call:", err);
        alert("Microphone access is required to make a call.");
        resetCallUI("Microphone Access Denied");
      }
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;

      if (isMuted) {
        muteBtn.classList.replace('bg-slate-800', 'bg-red-600/30');
        muteBtn.classList.add('text-red-400', 'border-red-500/50');
        muteIcon.className = "fa-solid fa-microphone-slash";
      } else {
        muteBtn.classList.replace('bg-red-600/30', 'bg-slate-800');
        muteBtn.classList.remove('text-red-400', 'border-red-500/50');
        muteIcon.className = "fa-solid fa-microphone";
      }
    }

    async function endCall(notifyPeer = true) {
      if (notifyPeer && isInitiator) {
        await set(ref(db, 'calls/active_call/status'), 'ended').catch(() => {});
        setTimeout(() => remove(callSessionRef), 500);
      }

      resetCallUI("Call Disconnected");
    }

    function resetCallUI(message) {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      stopTimer();
      isInitiator = false;

      updateStatusUI('idle', message || 'Ready to Call', "Press 'Call Phone 2' to start 1-on-1 audio conversation.");
      
      document.getElementById('localMeter').style.width = '0%';
      document.getElementById('remoteMeter').style.width = '0%';
      document.getElementById('localVolText').textContent = '0%';
      document.getElementById('remoteVolText').textContent = '0%';
    }

    function updateStatusUI(status, title, subtext) {
      callStateTitle.textContent = title;
      statusSubtext.textContent = subtext;

      avatarRing.className = "w-28 h-28 rounded-full flex items-center justify-center transition-all duration-300 ";

      if (status === 'calling') {
        avatarRing.className += "bg-blue-600/20 border-2 border-blue-500 pulse-ring";
        avatarIcon.className = "fa-solid fa-phone-volume text-4xl text-blue-400 animate-bounce";
        statusBadge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-blue-500/20 text-blue-300 border border-blue-500/30";
        statusBadge.textContent = "Calling...";
        idleControls.classList.add('hidden');
        activeControls.classList.remove('hidden');
        audioVisualizers.classList.remove('opacity-50');
      } else if (status === 'connected') {
        avatarRing.className += "bg-emerald-600/20 border-2 border-emerald-500";
        avatarIcon.className = "fa-solid fa-headset text-4xl text-emerald-400";
        statusBadge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        statusBadge.textContent = "In Call";
        callTimer.classList.remove('hidden');
        idleControls.classList.add('hidden');
        activeControls.classList.remove('hidden');
        audioVisualizers.classList.remove('opacity-50');
      } else { // idle / busy / ended
        avatarRing.className += "bg-slate-800/80 border-2 border-slate-600";
        avatarIcon.className = "fa-solid fa-mobile-screen-button text-4xl text-slate-400";
        statusBadge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700";
        statusBadge.textContent = status === 'busy' ? "Busy" : "Idle";
        callTimer.classList.add('hidden');
        idleControls.classList.remove('hidden');
        activeControls.classList.add('hidden');
        audioVisualizers.classList.add('opacity-50');
      }
    }

    function startTimer() {
      stopTimer();
      secondsElapsed = 0;
      callTimer.textContent = "00:00";
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        callTimer.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function setupAudioVisualizer(stream, meterId, textId, isLocal) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const analyser = ctx.createAnalyser();
        const source = ctx.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 64;

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const meterEl = document.getElementById(meterId);
        const textEl = document.getElementById(textId);

        function updateMeter() {
          if (!stream.active) return;
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          let average = sum / dataArray.length;
          let percent = Math.min(100, Math.round((average / 128) * 100));

          meterEl.style.width = percent + '%';
          textEl.textContent = percent + '%';

          requestAnimationFrame(updateMeter);
        }

        updateMeter();
      } catch (e) {
        console.error("Visualizer Error:", e);
      }
    }
  </script>
</body>
</html>
