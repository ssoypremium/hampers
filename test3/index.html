<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Encrypted A4 Label Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, sans-serif; }
    @media print {
      body * { visibility: hidden; }
      #printable-sheet, #printable-sheet * { visibility: visible; }
      #printable-sheet { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; }
      .no-print { display: none !important; }
      @page { size: A4 portrait; margin: 8mm; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 antialiased">

  <!-- Control Form -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-xl w-full flex flex-col gap-4 shadow-2xl mb-6 no-print">
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <h2 class="text-base font-bold text-white flex items-center gap-2">
        <i data-lucide="layers" class="w-5 h-5 text-indigo-400"></i> Batch Label Queue Generator
      </h2>
      <span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded border border-indigo-500/30">A4 Cut-Grid</span>
    </div>

    <!-- Input Fields -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
      <div class="col-span-2">
        <label class="text-[11px] text-slate-400">Item Name:</label>
        <input type="text" id="input-name" value="Wireless Mouse" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>
      <div class="col-span-2">
        <label class="text-[11px] text-slate-400">Declaration / Desc:</label>
        <input type="text" id="input-desc" value="Ergonomic 2.4G" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="text-[11px] text-slate-400">Price (₹):</label>
        <input type="number" id="input-price" value="499.00" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none">
      </div>
      <div>
        <label class="text-[11px] text-slate-400">Scan Qty:</label>
        <input type="number" id="input-qty" value="1" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none">
      </div>
      <div class="col-span-2">
        <label class="text-[11px] text-indigo-400 font-bold">Label Copies to Print:</label>
        <input type="number" id="input-copies" value="10" class="w-full bg-indigo-950/40 border border-indigo-800/60 rounded-lg px-2.5 py-1 text-xs text-indigo-200 font-bold focus:outline-none">
      </div>
    </div>

    <button onclick="addItemToQueue()" class="py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-lg">
      <i data-lucide="plus" class="w-4 h-4"></i> Add Item to Print Queue
    </button>

    <!-- Queue Table -->
    <div class="overflow-x-auto max-h-[140px] border border-slate-800 rounded-xl bg-slate-950">
      <table class="w-full text-left text-[11px]">
        <thead class="bg-slate-900 text-slate-400 border-b border-slate-800">
          <tr>
            <th class="p-2">Item Name</th>
            <th class="p-2">Price</th>
            <th class="p-2">Print Copies</th>
            <th class="p-2 text-center">Action</th>
          </tr>
        </thead>
        <tbody id="queue-tbody" class="divide-y divide-slate-800/50 text-slate-300 font-mono">
          <!-- Queue rows -->
        </tbody>
      </table>
    </div>

    <button onclick="window.print()" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-lg">
      <i data-lucide="printer" class="w-4 h-4"></i> Print / Download A4 PDF Sheet
    </button>
  </div>

  <!-- Printable A4 Sheet Grid -->
  <div id="printable-sheet" class="bg-white p-4 rounded-lg shadow-2xl w-[210mm] min-h-[297mm] flex flex-col text-black">
    <div class="text-center mb-3 border-b border-gray-300 pb-2">
      <h3 class="text-sm font-bold tracking-widest text-gray-800">BATCH ENCRYPTED PRODUCT LABELS</h3>
      <p class="text-[10px] text-gray-500">Cut-Border Grid Layout (45mm x 32mm)</p>
    </div>

    <div id="labels-grid" class="grid grid-cols-4 gap-2 flex-1 justify-items-center">
      <!-- Generated Labels Injected Here -->
    </div>
  </div>

  <script>
    lucide.createIcons();
    let itemQueue = [];
    const SECRET_KEY = "CAM_SYNC_SECRET_BILLING_KEY";

    function encryptData(text) {
      let result = '';
      for (let i = 0; i < text.length; i++) {
        result += String.fromCharCode(text.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
      }
      return "ENC:" + btoa(result);
    }

    function addItemToQueue() {
      const name = document.getElementById('input-name').value.trim();
      const desc = document.getElementById('input-desc').value.trim();
      const price = parseFloat(document.getElementById('input-price').value) || 0;
      const qty = parseInt(document.getElementById('input-qty').value) || 1;
      const copies = parseInt(document.getElementById('input-copies').value) || 1;

      if (!name) return;

      itemQueue.push({ id: Date.now(), name, desc, price, qty, copies });
      renderQueue();
      renderA4Grid();
    }

    function renderQueue() {
      const tbody = document.getElementById('queue-tbody');
      tbody.innerHTML = '';
      
      if (itemQueue.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-slate-600">Queue is empty. Add items above.</td></tr>`;
        return;
      }

      itemQueue.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-2 font-sans font-medium text-indigo-300">${item.name}</td>
          <td class="p-2">₹${item.price.toFixed(2)}</td>
          <td class="p-2 text-emerald-400 font-bold">${item.copies} Labels</td>
          <td class="p-2 text-center">
            <button onclick="removeFromQueue(${item.id})" class="text-rose-400 hover:text-rose-300"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
      lucide.createIcons();
    }

    window.removeFromQueue = function(id) {
      itemQueue = itemQueue.filter(i => i.id !== id);
      renderQueue();
      renderA4Grid();
    };

    function renderA4Grid() {
      const grid = document.getElementById('labels-grid');
      grid.innerHTML = '';

      itemQueue.forEach(item => {
        const rawJson = JSON.stringify({ name: item.name, desc: item.desc, price: item.price, qty: item.qty });
        const encryptedPayload = encryptData(rawJson);

        for (let i = 0; i < item.copies; i++) {
          const labelBox = document.createElement('div');
          labelBox.className = "w-[45mm] h-[32mm] border-2 border-dashed border-gray-400 p-1.5 flex flex-col items-center justify-between bg-white rounded-sm box-border relative";

          labelBox.innerHTML = `
            <div class="text-[9px] font-bold text-gray-800 truncate w-full text-center leading-tight">${item.name}</div>
            <div class="qr-placeholder w-[22mm] h-[22mm] flex items-center justify-center my-0.5"></div>
            <div class="text-[7.5px] font-mono text-gray-500 truncate w-full text-center">${item.desc}</div>
          `;

          grid.appendChild(labelBox);

          const qrPlace = labelBox.querySelector('.qr-placeholder');
          new QRCode(qrPlace, {
            text: encryptedPayload,
            width: 80,
            height: 80,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
          });
        }
      });
      lucide.createIcons();
    }

    // Auto-add initial item for quick preview
    window.onload = () => {
      addItemToQueue();
    };
  </script>
</body>
</html>
