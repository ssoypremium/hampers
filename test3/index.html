<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>O2 Remote Mouse & Keyboard Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, sans-serif; touch-action: none; }
    #reader video { border-radius: 0.75rem; object-fit: cover; width: 100% !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 antialiased">

  <!-- Header -->
  <header class="w-full max-w-md mb-4 flex items-center justify-between border-b border-slate-800 pb-3">
    <div class="flex items-center gap-2">
      <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
        <i data-lucide="mouse-pointer-click" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">O2 Remote Control</h1>
        <p class="text-[10px] text-slate-400">Phone to PC Mouse & Keyboard</p>
      </div>
    </div>
    <div id="status-badge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700">
      <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
      <span id="status-text">Initializing...</span>
    </div>
  </header>

  <main class="w-full max-w-md flex flex-col gap-4">

    <!-- QR Handshake Card -->
    <div id="qr-card" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col items-center text-center">
      <h2 class="text-sm font-bold text-slate-100 mb-1">Pair Device</h2>
      <p class="text-xs text-slate-400 mb-3">Scan this QR code from your phone to connect as a remote control.</p>
      <div class="bg-white p-2.5 rounded-xl border-4 border-slate-800 mb-3 relative min-h-[150px] min-w-[150px] flex items-center justify-center">
        <div id="qrcode"></div>
        <div id="qr-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 text-slate-400 rounded-lg">
          <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-indigo-400 mb-1"></i>
          <span class="text-[10px]">Generating...</span>
        </div>
      </div>
      <button id="btn-open-scanner" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2">
        <i data-lucide="camera" class="w-4 h-4"></i> Scan QR Code
      </button>
    </div>

    <!-- Remote Controller Interface (Hidden until connected on mobile or active on remote) -->
    <div id="control-section" class="hidden flex flex-col gap-4">
      
      <!-- Touchpad Area -->
      <div id="touchpad" class="bg-slate-900 border-2 border-dashed border-slate-700 rounded-2xl h-48 flex flex-col items-center justify-center select-none cursor-pointer relative shadow-inner active:border-indigo-500">
        <i data-lucide="move" class="w-6 h-6 text-slate-600 mb-1"></i>
        <span class="text-xs font-semibold text-slate-400">Touchpad Area (Swipe to move mouse)</span>
        <div class="absolute bottom-2 w-full flex justify-around px-4">
          <button id="btn-left-click" class="px-6 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-bold border border-slate-700 shadow">LEFT CLICK</button>
          <button id="btn-right-click" class="px-6 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-bold border border-slate-700 shadow">RIGHT CLICK</button>
        </div>
      </div>

      <!-- Remote Keyboard Input -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col gap-2">
        <label class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
          <i data-lucide="keyboard" class="w-4 h-4 text-cyan-400"></i> Remote Keyboard Type
        </label>
        <div class="flex gap-2">
          <input type="text" id="type-input" placeholder="Type text to send to PC..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 font-mono">
          <button id="btn-send-text" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow">Send</button>
        </div>
      </div>

    </div>

    <!-- PC Receiver Logs / Status Display -->
    <div id="receiver-log-box" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col gap-2">
      <h3 class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
        <i data-lucide="terminal" class="w-4 h-4 text-emerald-400"></i> PC Receiver Activity
      </h3>
      <div id="log-content" class="bg-slate-950 p-3 rounded-xl text-[11px] font-mono text-emerald-400 h-28 overflow-y-auto border border-slate-800">
        Waiting for remote commands...
      </div>
    </div>

  </main>

  <!-- Scanner Modal -->
  <div id="scanner-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 max-w-sm w-full shadow-2xl flex flex-col gap-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h3 class="text-xs font-semibold text-slate-200 flex items-center gap-1">Scan QR</h3>
        <button id="btn-close-scanner" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="overflow-hidden rounded-xl bg-black min-h-[200px]"><div id="reader" class="w-full"></div></div>
    </div>
  </div>

  <script>
    let peer = null, conn = null, myPeerId = null, html5QrcodeScanner = null;
    let isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    const statusBadge = document.getElementById('status-badge'), statusText = document.getElementById('status-text');
    const qrCard = document.getElementById('qr-card'), controlSection = document.getElementById('control-section');
    const qrContainer = document.getElementById('qrcode'), qrLoader = document.getElementById('qr-loader');
    const logContent = document.getElementById('log-content');
    const touchpad = document.getElementById('touchpad'), typeInput = document.getElementById('type-input');

    lucide.createIcons();

    const urlParams = new URLSearchParams(window.location.search);
    const targetFromUrl = urlParams.get('connect');

    function initPeer() {
      peer = new Peer({ debug: 1 });
      peer.on('open', (id) => {
        myPeerId = id;
        qrLoader.classList.add('hidden');
        new QRCode(qrContainer, { text: `${window.location.origin}${window.location.pathname}?connect=${id}`, width: 140, height: 140 });
        updateStatus('waiting', 'Ready');
        if (targetFromUrl) connectToPeer(targetFromUrl);
      });
      peer.on('connection', (incomingConn) => setupConnection(incomingConn));
    }

    function connectToPeer(targetId) {
      if (!targetId || targetId === myPeerId) return;
      updateStatus('connecting', 'Connecting...');
      setupConnection(peer.connect(targetId, { reliable: true }));
    }

    function setupConnection(connection) {
      conn = connection;
      conn.on('open', () => {
        updateStatus('connected', 'Connected');
        qrCard.classList.add('hidden');
        controlSection.classList.remove('hidden');
      });

      conn.on('data', (data) => {
        // PC Side execution of incoming phone commands
        if (data.type === 'mousemove') {
          logContent.innerHTML += `<div>[Mouse Move] dx: ${data.dx}, dy: ${data.dy}</div>`;
        } else if (data.type === 'click') {
          logContent.innerHTML += `<div>[Mouse Click] ${data.button}</div>`;
        } else if (data.type === 'type') {
          logContent.innerHTML += `<div>[Keyboard Type] ${data.text}</div>`;
        }
        logContent.scrollTop = logContent.scrollHeight;
      });

      conn.on('close', () => updateStatus('waiting', 'Disconnected'));
    }

    function updateStatus(state, msg) {
      statusText.textContent = msg;
      if (state === 'connected') {
        statusBadge.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-emerald-400';
        qrCard.classList.add('hidden');
        controlSection.classList.remove('hidden');
      }
    }

    // Touchpad Move Events (Phone Side)
    let startX = 0, startY = 0;
    touchpad.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });

    touchpad.addEventListener('touchmove', (e) => {
      if (!conn || !conn.open) return;
      let currentX = e.touches[0].clientX;
      let currentY = e.touches[0].clientY;
      let dx = currentX - startX;
      let dy = currentY - startY;
      startX = currentX;
      startY = currentY;

      conn.send({ type: 'mousemove', dx: dx, dy: dy });
    });

    document.getElementById('btn-left-click').addEventListener('click', () => {
      if (conn && conn.open) conn.send({ type: 'click', button: 'LEFT' });
    });
    document.getElementById('btn-right-click').addEventListener('click', () => {
      if (conn && conn.open) conn.send({ type: 'click', button: 'RIGHT' });
    });

    document.getElementById('btn-send-text').addEventListener('click', () => {
      let text = typeInput.value.trim();
      if (!text || !conn || !conn.open) return;
      conn.send({ type: 'type', text: text });
      typeInput.value = '';
    });

    document.getElementById('btn-open-scanner').addEventListener('click', () => {
      document.getElementById('scanner-modal').classList.remove('hidden');
      if (!html5QrcodeScanner) html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 160 }, (text) => {
        document.getElementById('scanner-modal').classList.add('hidden');
        if (html5QrcodeScanner.isScanning) html5QrcodeScanner.stop();
        let targetId = text.includes('connect=') ? new URL(text).searchParams.get('connect') : text;
        connectToPeer(targetId);
      });
    });

    document.getElementById('btn-close-scanner').addEventListener('click', () => {
      document.getElementById('scanner-modal').classList.add('hidden');
      if (html5QrcodeScanner && html5QrcodeScanner.isScanning) html5QrcodeScanner.stop();
    });

    window.addEventListener('load', initPeer);
  </script>
</body>
</html>
