<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O2 Billing System & QR Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    #reader video { border-radius: 12px; object-fit: cover; }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

  <header class="w-full max-w-4xl mb-6 flex items-center justify-between border-b border-slate-800 pb-4">
    <div>
      <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-teal-300 bg-clip-text text-transparent">
        O2 Billing System
      </h1>
      <p class="text-xs text-slate-400">Scanner & Invoice Generator</p>
    </div>
    <button onclick="window.print()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold flex items-center gap-2 transition shadow-lg">
      <i data-lucide="printer" class="w-4 h-4"></i> Print Bill
    </button>
  </header>

  <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Scanner Section -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col items-center">
      <h2 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2 w-full">
        <i data-lucide="qr-code" class="w-4 h-4 text-indigo-400"></i> Scan Item QR
      </h2>
      <div id="reader" class="w-full bg-slate-950 rounded-xl overflow-hidden border border-slate-800 min-h-[220px]"></div>
      <p id="scan-status" class="text-[11px] text-slate-500 mt-3 text-center">Camera ready for scanning...</p>
    </div>

    <!-- Billing Table Section -->
    <div class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-2">
          <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
            <i data-lucide="shopping-cart" class="w-4 h-4 text-emerald-400"></i> Scanned Items
          </h2>
          <button onclick="clearAllItems()" class="text-xs text-rose-400 hover:text-rose-300 flex items-center gap-1">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Clear Table
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="text-[11px] text-slate-400 uppercase bg-slate-950/50 border-b border-slate-800">
              <tr>
                <th class="py-2.5 px-3">#</th>
                <th class="py-2.5 px-3">Item Description</th>
                <th class="py-2.5 px-3 text-center">Qty</th>
                <th class="py-2.5 px-3 text-right">Price</th>
                <th class="py-2.5 px-3 text-right">Total</th>
                <th class="py-2.5 px-3 text-center">Action</th>
              </tr>
            </thead>
            <tbody id="bill-table-body">
              <tr>
                <td colspan="6" class="py-8 text-center text-slate-500">No items scanned yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Bill Summary Footer -->
      <div class="border-t border-slate-800 pt-4 mt-6 flex justify-between items-center">
        <div>
          <span class="text-xs text-slate-400">Total Items: </span>
          <span id="total-qty" class="text-sm font-bold text-indigo-400 font-mono">0</span>
        </div>
        <div class="text-right">
          <span class="text-xs text-slate-400 block">Grand Total</span>
          <span id="grand-total" class="text-xl font-extrabold text-emerald-400 font-mono">₹ 0.00</span>
        </div>
      </div>
    </div>

  </main>

  <script>
    const SECRET_KEY = "CAM_SYNC_SECRET_BILLING_KEY";
    let scannedItems = [];

    lucide.createIcons();

    function decryptData(encryptedStr) {
      try {
        if (!encryptedStr.startsWith("ENC:")) return null;
        const cleanBase64 = encryptedStr.replace("ENC:", "");
        const rawString = atob(cleanBase64);
        let decrypted = '';
        for (let i = 0; i < rawString.length; i++) {
          decrypted += String.fromCharCode(rawString.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
        }
        return JSON.parse(decrypted);
      } catch (e) {
        console.error("Decryption error:", e);
        return null;
      }
    }

    function processScannedData(rawText) {
      const decrypted = decryptData(rawText);
      
      let itemData = {
        name: rawText,
        qty: 1,
        price: 0.00
      };

      if (decrypted) {
        // Smart Formatting: Check if description exists before adding brackets
        const itemName = decrypted.name || decrypted.desc || "Item";
        const itemDesc = (decrypted.name && decrypted.desc && decrypted.name !== decrypted.desc) ? decrypted.desc : "";
        
        itemData.name = itemDesc ? `${itemName} (${itemDesc})` : itemName;
        itemData.qty = parseInt(decrypted.qty) || 1;
        itemData.price = parseFloat(decrypted.price) || 0.00;
      }

      scannedItems.push(itemData);
      renderBillTable();
    }

    function renderBillTable() {
      const tbody = document.getElementById('bill-table-body');
      tbody.innerHTML = '';

      if (scannedItems.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-500">No items scanned yet.</td></tr>`;
        document.getElementById('total-qty').textContent = '0';
        document.getElementById('grand-total').textContent = '₹ 0.00';
        return;
      }

      let grandTotal = 0;
      let totalQty = 0;

      scannedItems.forEach((item, index) => {
        const itemTotal = item.qty * item.price;
        grandTotal += itemTotal;
        totalQty += item.qty;

        const tr = document.createElement('tr');
        tr.className = "border-b border-slate-800/50 hover:bg-slate-800/30 transition";
        tr.innerHTML = `
          <td class="py-2.5 px-3 text-slate-500 font-mono">${index + 1}</td>
          <td class="py-2.5 px-3 font-medium text-slate-200">${item.name}</td>
          <td class="py-2.5 px-3 text-center font-mono">${item.qty}</td>
          <td class="py-2.5 px-3 text-right font-mono">₹ ${item.price.toFixed(2)}</td>
          <td class="py-2.5 px-3 text-right font-mono text-emerald-400 font-bold">₹ ${itemTotal.toFixed(2)}</td>
          <td class="py-2.5 px-3 text-center">
            <button onclick="removeItem(${index})" class="text-slate-500 hover:text-rose-400 transition">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('total-qty').textContent = totalQty;
      document.getElementById('grand-total').textContent = `₹ ${grandTotal.toFixed(2)}`;
      lucide.createIcons();
    }

    function removeItem(index) {
      scannedItems.splice(index, 1);
      renderBillTable();
    }

    function clearAllItems() {
      scannedItems = [];
      renderBillTable();
    }

    // Initialize HTML5 QR Scanner
    let lastScannedText = "";
    let lastScanTime = 0;

    function onScanSuccess(decodedText) {
      const currentTime = Date.now();
      // Debounce scanner for 1.5 seconds to prevent multiple duplicate scans
      if (decodedText === lastScannedText && (currentTime - lastScanTime) < 1500) {
        return;
      }
      
      lastScannedText = decodedText;
      lastScanTime = currentTime;

      document.getElementById('scan-status').textContent = "Item scanned successfully!";
      document.getElementById('scan-status').className = "text-[11px] text-emerald-400 mt-3 text-center font-semibold";
      
      processScannedData(decodedText);

      setTimeout(() => {
        document.getElementById('scan-status').textContent = "Camera ready for scanning...";
        document.getElementById('scan-status').className = "text-[11px] text-slate-500 mt-3 text-center";
      }, 2000);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { fps: 10, qrbox: { width: 200, height: 200 } },
      /* verbose= */ false
    );
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
