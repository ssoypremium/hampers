<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harleen's Personal Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(180deg, #f4f8f3 0%, #e8f2e6 100%);
            color: #1a1a1a;
        }

        .player-card {
            background: #ffffff;
            border: 1px solid rgba(120, 184, 51, 0.25);
            box-shadow: 0 12px 32px rgba(26, 26, 26, 0.08), 0 2px 6px rgba(120, 184, 51, 0.1);
            border-radius: 20px;
        }

        /* Continuous Rotating Disc Animation */
        .rotating-disc {
            animation: spin 10s linear infinite;
            animation-play-state: paused;
        }

        .rotating-disc.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus { outline: none; }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 5px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 10px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #78b833;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -4.5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: transform 0.15s ease;
        }

        input[type=range]:hover::-webkit-slider-thumb {
            transform: scale(1.2);
        }

        #visualizer {
            width: 100%;
            height: 36px;
        }
    </style>
</head>
<body class="flex flex-col justify-between items-center p-3 h-screen">

    <!-- Top Header Badge -->
    <div class="mt-1">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white border border-[#78b833]/30 text-[11px] font-bold uppercase tracking-wider text-[#1a1a1a] shadow-sm">
            <span class="w-2 h-2 rounded-full bg-[#78b833] animate-ping"></span>
            Harleen's Studio
        </div>
    </div>

    <!-- Main Player Card -->
    <div class="w-full max-w-[340px] my-auto">
        <div class="player-card p-4 sm:p-5 text-center relative overflow-hidden">
            
            <!-- Date Display -->
            <div class="text-[11px] font-semibold text-gray-500 mb-2 flex items-center justify-center gap-1" id="dateDisplay">
                <i class="fa-regular fa-calendar text-[#78b833]"></i>
                <span>Loading...</span>
            </div>

            <!-- Rotating Center Image Artwork (sandy.jpg) -->
            <div class="flex justify-center my-2">
                <div class="relative p-1 rounded-full border-2 border-[#78b833]/30 bg-gradient-to-tr from-[#78b833]/10 to-white shadow-md">
                    <div id="albumDisc" class="rotating-disc w-24 h-24 rounded-full border-2 border-white flex items-center justify-center overflow-hidden relative shadow-inner">
                        <img src="https://raw.githubusercontent.com/ssoypremium/hampers/refs/heads/main/beat/sandy.jpg" 
                             alt="Sandy" 
                             class="w-full h-full rounded-full object-cover"
                             onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80'">
                    </div>
                </div>
            </div>

            <!-- Track Info -->
            <div class="mt-2 mb-1">
                <div class="text-base font-bold text-[#1a1a1a] truncate" id="trackTitle">beat.mp3</div>
                <div class="text-[11px] text-[#78b833] font-semibold">ssoy.in / Special Playlist</div>
            </div>

            <!-- Beat Visualizer -->
            <div class="my-2 bg-[#f4f8f3] px-2 py-1 rounded-lg border border-[#78b833]/20">
                <canvas id="visualizer"></canvas>
            </div>

            <!-- Audio Progress Bar & Timing -->
            <div class="mt-2">
                <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1">
                <div class="flex justify-between text-[10px] text-gray-500 mt-1 font-mono font-medium">
                    <span id="currentTime">00:00</span>
                    <span id="totalDuration">00:00</span>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="flex items-center justify-center gap-3 my-3">
                <!-- Previous Song -->
                <button id="btnPrev" title="Previous Song" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-[#78b833]/20 text-[#1a1a1a] transition flex items-center justify-center border border-gray-200">
                    <i class="fa-solid fa-backward-step text-xs"></i>
                </button>

                <!-- Play / Pause -->
                <button id="btnPlayPause" title="Play/Pause" class="w-12 h-12 rounded-full bg-[#78b833] hover:bg-[#68a22b] text-white text-lg flex items-center justify-center shadow-md active:scale-95 transition">
                    <i class="fa-solid fa-play ml-0.5" id="playIcon"></i>
                </button>

                <!-- Next Song -->
                <button id="btnNext" title="Next Song" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-[#78b833]/20 text-[#1a1a1a] transition flex items-center justify-center border border-gray-200">
                    <i class="fa-solid fa-forward-step text-xs"></i>
                </button>
            </div>

            <!-- Volume Slider Row -->
            <div class="flex items-center gap-2 mt-3 pt-2 border-t border-gray-100">
                <div class="flex items-center gap-1.5 flex-1 bg-gray-50 px-2.5 py-1.5 rounded-lg border border-gray-200">
                    <button id="btnMute" class="text-[#78b833] hover:text-[#1a1a1a] transition">
                        <i class="fa-solid fa-volume-high text-xs" id="volumeIcon"></i>
                    </button>
                    <input type="range" id="volumeBar" value="80" min="0" max="100" step="1" class="w-full">
                </div>
            </div>

            <!-- DOWNLOAD BUTTON (COMMENTED OUT - Currently Disabled) -->
            <!-- 
            <div class="mt-3">
                <a id="btnDownload" href="#" download class="w-full py-2 bg-gray-100 hover:bg-[#78b833]/20 text-[#1a1a1a] text-xs font-semibold rounded-xl border border-gray-200 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download text-[#78b833]"></i> Download Audio
                </a>
            </div> 
            -->

            <!-- Hidden Audio Element -->
            <audio id="audioPlayer" preload="metadata" crossOrigin="anonymous"></audio>
        </div>
    </div>

    <script>
        // Set Today's English Date
        const dateElem = document.getElementById('dateDisplay');
        const today = new Date();
        const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
        dateElem.querySelector('span').innerText = today.toLocaleDateString('en-US', options);

        // Multiple Songs Playlist
        const playlist = [
            { name: "beat.mp3", url: "https://ssoy.in/beat/beat.mp3" },
            // Aap aur songs yahan add kar sakte hain:
            // { name: "song2.mp3", url: "https://ssoy.in/beat/song2.mp3" }
        ];

        let currentTrackIndex = 0;

        // Elements
        const audio = document.getElementById('audioPlayer');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const playIcon = document.getElementById('playIcon');
        const albumDisc = document.getElementById('albumDisc');
        const trackTitle = document.getElementById('trackTitle');
        const seekBar = document.getElementById('seekBar');
        const currentTimeElem = document.getElementById('currentTime');
        const totalDurationElem = document.getElementById('totalDuration');
        const volumeBar = document.getElementById('volumeBar');
        const btnMute = document.getElementById('btnMute');
        const volumeIcon = document.getElementById('volumeIcon');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        let audioCtx, analyser, source, dataArray, bufferLength;
        let isAudioContextInit = false;
        let lastVolume = 0.8;

        function loadTrack(index) {
            audio.src = playlist[index].url;
            trackTitle.innerText = playlist[index].name;
            seekBar.value = 0;
            currentTimeElem.innerText = "00:00";
            
            // Download button link update (agar future mein comment hatayenge toh yeh kaam karega)
            const btnDownload = document.getElementById('btnDownload');
            if(btnDownload) {
                btnDownload.href = playlist[index].url;
            }
        }

        loadTrack(currentTrackIndex);

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function initAudioContext() {
            if (isAudioContextInit) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                isAudioContextInit = true;
            } catch (e) {
                console.log("Audio Context fallback");
            }
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            const width = canvas.width;
            const height = canvas.height;
            canvasCtx.clearRect(0, 0, width, height);

            if (isAudioContextInit && !audio.paused && dataArray) {
                analyser.getByteFrequencyData(dataArray);
            }

            const barCount = 20;
            const barWidth = (width / barCount) - 2;
            let x = 1;

            for (let i = 0; i < barCount; i++) {
                let barHeight = 3;
                if (!audio.paused) {
                    if (isAudioContextInit && dataArray) {
                        const val = dataArray[i % bufferLength] || 0;
                        barHeight = Math.max(3, (val / 255) * height);
                    } else {
                        barHeight = Math.max(3, Math.sin(Date.now() * 0.008 + i * 0.5) * (height / 2) + (height / 2.2));
                    }
                }

                canvasCtx.fillStyle = '#78b833';
                canvasCtx.beginPath();
                canvasCtx.roundRect(x, height - barHeight, barWidth, barHeight, [2, 2, 0, 0]);
                canvasCtx.fill();

                x += barWidth + 2;
            }
        }
        drawVisualizer();

        function togglePlay() {
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.className = "fa-solid fa-pause";
                    albumDisc.classList.add('playing');
                }).catch(err => console.log(err));
            } else {
                audio.pause();
                playIcon.className = "fa-solid fa-play ml-0.5";
                albumDisc.classList.remove('playing');
            }
        }

        btnPlayPause.addEventListener('click', togglePlay);

        audio.addEventListener('loadedmetadata', () => {
            seekBar.max = audio.duration;
            totalDurationElem.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            seekBar.value = audio.currentTime;
            currentTimeElem.innerText = formatTime(audio.currentTime);
            if (audio.duration) totalDurationElem.innerText = formatTime(audio.duration);
        });

        seekBar.addEventListener('input', () => {
            audio.currentTime = seekBar.value;
        });

        volumeBar.addEventListener('input', () => {
            audio.volume = volumeBar.value / 100;
            updateVolumeIcon(audio.volume);
        });

        function updateVolumeIcon(vol) {
            if (vol === 0) {
                volumeIcon.className = "fa-solid fa-volume-xmark text-red-500 text-xs";
            } else if (vol < 0.5) {
                volumeIcon.className = "fa-solid fa-volume-low text-xs";
            } else {
                volumeIcon.className = "fa-solid fa-volume-high text-xs";
            }
        }

        btnMute.addEventListener('click', () => {
            if (audio.volume > 0) {
                lastVolume = audio.volume;
                audio.volume = 0;
                volumeBar.value = 0;
            } else {
                audio.volume = lastVolume || 0.8;
                volumeBar.value = (lastVolume || 0.8) * 100;
            }
            updateVolumeIcon(audio.volume);
        });

        // Next & Previous Track Handling
        btnNext.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            togglePlay();
        });

        btnPrev.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            togglePlay();
        });

        // Auto play next song when current track ends
        audio.addEventListener('ended', () => {
            btnNext.click();
        });

        // Right Click & Developer Tools Disable
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.onkeydown = function (e) {
            if (e.keyCode === 123) return false;
            if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 67 || e.keyCode === 74)) return false;
            if (e.ctrlKey && e.keyCode === 85) return false;
        };
    </script>
</body>
</html>
