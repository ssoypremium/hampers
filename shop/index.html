<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sachleen Electronics & Components Hub</title>
  
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #0f172a;
      --primary-light: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-orange: #ff5800;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --whatsapp: #25d366;
      --whatsapp-hover: #22bf5b;
      --border-color: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 110px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 900;
      box-shadow: var(--shadow-md);
    }

    .header-content {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title i {
      color: #f59e0b;
    }

    .brand-tagline {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 500;
      margin-top: 2px;
    }

    /* Hero Banner */
    .hero-banner {
      margin: 20px 0 24px 0;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      border-radius: 20px;
      padding: 36px 28px;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 14px 32px -10px rgba(49, 46, 129, 0.4);
    }

    .hero-banner::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(99,102,241,0.35) 0%, rgba(255,255,255,0) 70%);
      border-radius: 50%;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .hero-title {
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .hero-desc {
      font-size: 0.95rem;
      color: #c7d2fe;
      line-height: 1.5;
      max-width: 650px;
    }

    /* Search Box */
    .search-container {
      margin: 20px 0;
    }

    .search-wrapper {
      position: relative;
    }

    .search-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* Accordion Category Layout */
    .category-group-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .category-accordion {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .category-header {
      padding: 18px 20px;
      background: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease;
    }

    .category-header:hover {
      background: #f8fafc;
    }

    .category-title-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .category-title-info i {
      font-size: 1.2rem;
      color: var(--accent);
    }

    .category-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .category-count-badge {
      background: #e2e8f0;
      color: var(--text-main);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 12px;
    }

    .toggle-icon {
      font-size: 1rem;
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }

    .category-accordion.open .toggle-icon {
      transform: rotate(180deg);
    }

    /* Sub-products Inside Category */
    .category-content {
      display: none;
      padding: 16px;
      background: #f8fafc;
      border-top: 1px solid var(--border-color);
    }

    .category-accordion.open .category-content {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .product-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }

    .prod-img {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      object-fit: cover;
      background: #f1f5f9;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }

    .prod-details {
      flex-grow: 1;
    }

    .prod-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    /* Quantity Controls */
    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .qty-btn-group {
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 2px;
      border: 1px solid var(--border-color);
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border: none;
      background: #fff;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      color: var(--text-main);
    }

    .qty-val {
      padding: 0 10px;
      font-size: 0.82rem;
      font-weight: 800;
    }

    /* Fixed Bottom Cart Bar */
    .bottom-cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      padding: 14px 20px;
      border-top: 1px solid var(--border-color);
      box-shadow: 0 -8px 25px rgba(0,0,0,0.08);
      z-index: 1000;
    }

    .cart-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-info {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .cart-count {
      color: var(--accent-orange);
      font-size: 1.2rem;
      font-weight: 800;
    }

    .btn-whatsapp-send {
      background: var(--whatsapp);
      color: #fff;
      border: none;
      padding: 12px 26px;
      border-radius: 25px;
      font-weight: 800;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }

    .empty-state {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .hero-banner {
        padding: 24px 20px;
      }
      .hero-title {
        font-size: 1.35rem;
      }
      .category-accordion.open .category-content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="header-content">
      <div>
        <div class="brand-title"><i class="fa-solid fa-bolt"></i> Sachleen Electronics</div>
        <div class="brand-tagline">TV Remotes, IC, Diode, Speakers & Components</div>        
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- Hero Banner -->
    <div class="hero-banner">
      <div class="hero-badge"><i class="fa-solid fa-microchip"></i> Premium Hardware</div>
      <div class="hero-title">Arduino & Electronic Components Hub</div>
      <div class="hero-desc">Explore high-grade sensors, ICs, audio modules & DIY component kits at the best competitive prices.</div>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search items across all categories..." 
          onkeyup="filterProducts()"
        >
      </div>
    </div>

    <!-- Category Dropdowns Area -->
    <div class="category-group-list" id="categoryGroupList">
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>Loading components...</p>
      </div>
    </div>

  </div>

  <!-- Bottom Floating Cart Bar -->
  <div class="bottom-cart-bar">
    <div class="cart-container">
      <div class="cart-info">
        Selected Items: <span id="totalItems" class="cart-count">0</span>
      </div>
      <button class="btn-whatsapp-send" onclick="sendWhatsAppOrder()">
        <i class="fa-brands fa-whatsapp"></i> Send Order
      </button>
    </div>
  </div>

  <script>
    const SHEET_ID = '1ZMgmEselSsR0G5LVx7n1eQM_ABxOMb2dAcoo_6_8xaU'; 
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    let productsData = [];
    let cart = {}; 

    // Format Drive URLs
    function formatImageUrl(url) {
      if (!url) return 'https://via.placeholder.com/80?text=Parts';
      if (url.includes('drive.google.com')) {
        let match = url.match(/\/d\/([^\/]+)/) || url.match(/id=([^&]+)/);
        if (match && match[1]) {
          return `https://lh3.googleusercontent.com/d/${match[1]}=s300`;
        }
      }
      return url;
    }

    // Fetch Google Sheet Data
    async function fetchSheetData() {
      try {
        const response = await fetch(SHEET_URL);
        const text = await response.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        
        const rows = json.table.rows;
        let fetchedProducts = [];

        rows.forEach(row => {
          if (row.c && row.c[0] && row.c[1]) {
            if (row.c[0].v.toString().toLowerCase() !== 'category') {
              let rawImg = row.c[2]?.v || '';
              fetchedProducts.push({
                category: row.c[0]?.v ? row.c[0].v.trim() : 'General Parts',
                name: row.c[1]?.v || '',
                image: formatImageUrl(rawImg),
              });
            }
          }
        });

        productsData = fetchedProducts;
        renderAccordionCategories(productsData);
      } catch (err) {
        console.error("Sheet loading error:", err);
        document.getElementById("categoryGroupList").innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-triangle-exclamation" style="color: #ef4444;"></i>
            <p>Google Sheet loading error. Please check sharing settings!</p>
          </div>`;
      }
    }

    // Helper to safely encode product names for HTML data attributes
    function encodeDataAttr(str) {
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Render Grouped Accordion Categories
    function renderAccordionCategories(data) {
      const container = document.getElementById("categoryGroupList");
      container.innerHTML = "";

      if (data.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-box-open"></i>
            <p>No products found matching your search.</p>
          </div>`;
        return;
      }

      // Group products by category
      const grouped = {};
      data.forEach(item => {
        if (!grouped[item.category]) {
          grouped[item.category] = [];
        }
        grouped[item.category].push(item);
      });

      const isSearching = document.getElementById("searchInput").value.trim().length > 0;

      // Render Category Sections
      for (let category in grouped) {
        const items = grouped[category];
        
        const accordion = document.createElement("div");
        accordion.className = `category-accordion ${isSearching ? 'open' : ''}`; // Auto open when searching
        
        let itemsHTML = '';
        items.forEach(item => {
          const qty = cart[item.name] || 0;
          const encodedName = encodeDataAttr(item.name);

          itemsHTML += `
            <div class="product-card">
              <img src="${item.image}" alt="${encodedName}" class="prod-img" onerror="this.src='https://via.placeholder.com/80?text=Parts'">
              <div class="prod-details">
                <div class="prod-title">${item.name}</div>
                <div class="action-row">
                  <div class="qty-btn-group">
                    <button class="qty-btn" onclick="updateQty(this, -1)">-</button>
                    <span class="qty-val" data-product-name="${encodedName}">${qty}</span>
                    <button class="qty-btn" onclick="updateQty(this, 1)">+</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        });

        accordion.innerHTML = `
          <div class="category-header" onclick="toggleAccordion(this)">
            <div class="category-title-info">
              <i class="fa-solid fa-layer-group"></i>
              <span class="category-name">${category}</span>
              <span class="category-count-badge">${items.length} items</span>
            </div>
            <i class="fa-solid fa-chevron-down toggle-icon"></i>
          </div>
          <div class="category-content">
            ${itemsHTML}
          </div>
        `;

        container.appendChild(accordion);
      }
    }

    // Toggle Dropdown Group
    function toggleAccordion(headerEl) {
      const parent = headerEl.parentElement;
      parent.classList.toggle("open");
    }

    // Update Quantity smoothly without refreshing the categories list
    function updateQty(buttonEl, change) {
      const qtyValSpan = buttonEl.parentElement.querySelector('.qty-val');
      const productName = qtyValSpan.getAttribute('data-product-name');

      if (!cart[productName]) cart[productName] = 0;
      cart[productName] += change;

      if (cart[productName] <= 0) {
        delete cart[productName];
        qtyValSpan.innerText = 0;
      } else {
        qtyValSpan.innerText = cart[productName];
      }

      updateCartUI();
    }

    // Update Cart Counter
    function updateCartUI() {
      let totalCount = 0;
      for (let item in cart) {
        totalCount += cart[item];
      }
      document.getElementById("totalItems").innerText = totalCount;
    }

    // Search Filter Logic
    function filterProducts() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();

      const filtered = productsData.filter(item => {
        return item.name.toLowerCase().includes(query) || item.category.toLowerCase().includes(query);
      });

      renderAccordionCategories(filtered);
    }

    // Send WhatsApp Order
    function sendWhatsAppOrder() {
      const phone = "918847259996";
      let message = "Hello Sachleen! I want to order the following electronic items:\n\n";
      
      let itemsList = "";
      let count = 1;
      for (let item in cart) {
        itemsList += `${count}. ${item} - Quantity: ${cart[item]}\n`;
        count++;
      }

      if (itemsList === "") {
        alert("No Items Selected In The Cart");
        return;
      }

      message += itemsList + "\nPlease share the best price and deal for this order.";
      const encodedMsg = encodeURIComponent(message);
      window.open(`https://wa.me/${phone}?text=${encodedMsg}`, '_blank');
    }

    // Initialize Page
    fetchSheetData();
  </script>

</body>
</html>
